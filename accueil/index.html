<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMTK V1 - Football Manager</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a1a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            background: rgba(10,30,10,0.7);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.1);
        }
        .logo { font-size: 2.5rem; color: #FFD700; font-weight: bold; }
        .logo-sub { color: #7aaa7a; font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; }
        .version { color: #2ecc71; font-size: 0.7rem; margin-top: 5px; }
        h1 { color: #FFD700; font-size: 1.5rem; margin-top: 20px; }
        p { color: #8aaa8a; margin: 15px 0; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #FFD700;
            color: #0a1a0a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: #f5c400; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚽ FMTK</div>
        <div class="logo-sub">Football Manager</div>
        <div class="version">📌 VERSION 1.0</div>
        <h1>Bienvenue Manager !</h1>
        <p>Le site est en construction.<br>Revenez bientôt pour découvrir le jeu.</p>
        <a href="#" class="btn">🚀 Commencer</a>
    </div>
</body>
</html>
