<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FMTK V1 - Football Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body {
            padding: 10px;
            background: radial-gradient(ellipse at center, #0d1f0d 0%, #0a0a0a 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(10,20,10,0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,215,0,0.06);
            padding: 20px 16px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            max-height: 98vh;
            overflow-y: auto;
        }
        .container::-webkit-scrollbar { width: 4px; }
        .container::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.2); border-radius: 10px; }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('OIP-1393549177.jpg') center/cover no-repeat;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }
        .container > * { position: relative; z-index: 1; }

        .header { text-align: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,215,0,0.05); margin-bottom: 14px; }
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            color: #FFD700;
            letter-spacing: 2px;
            line-height: 1.1;
        }
        .logo span { color: #fff; font-weight: 300; }
        .logo .v1 { font-size: 0.7rem; color: #2ecc71; font-weight: 700; margin-left: 3px; vertical-align: super; }
        .logo-sub { font-size: 0.6rem; color: #7aaa7a; letter-spacing: 5px; text-transform: uppercase; font-weight: 300; margin-top: 2px; }
        .version-badge { display: inline-block; padding: 2px 10px; border: 1px solid rgba(255,215,0,0.1); border-radius: 10px; font-size: 0.5rem; color: #FFD700; letter-spacing: 1px; background: rgba(255,215,0,0.03); margin-top: 4px; }
        .version-badge i { color: #2ecc71; font-size: 4px; margin-right: 4px; }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 14px;
        }
        .feature-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 6px 2px;
            text-align: center;
            color: #9aaa9a;
            font-size: 0.5rem;
            font-weight: 400;
        }
        .feature-item i { color: #FFD700; font-size: 0.7rem; display: block; margin-bottom: 2px; }

        .tabs {
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 12px;
            background: rgba(255,255,255,0.01);
        }
        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            background: transparent;
            color: #6a8a6a;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #FFD700; background: rgba(255,215,0,0.04); border-bottom-color: #FFD700; }

        .form { display: none; flex-direction: column; gap: 8px; }
        .form.active { display: flex; }

        .form-group { position: relative; }
        .form-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #5a7a5a;
            font-size: 0.7rem;
            z-index: 2;
            pointer-events: none;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 10px 10px 34px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: rgba(255,215,0,0.2);
            background: rgba(255,255,255,0.06);
        }
        .form-group input::placeholder { color: #5a7a5a; font-weight: 300; }
        .form-group select option { background: #1a2e1a; color: #fff; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .whatsapp-required {
            font-size: 0.65rem;
            color: #ff6b6b;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,107,107,0.08);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1.5px solid rgba(255,107,107,0.15);
            font-weight: 600;
            margin: 2px 0;
        }
        .whatsapp-required i { font-size: 0.8rem; color: #ff6b6b; }
        .whatsapp-required .fa-exclamation-circle { animation: pulse-warning 1.5s infinite; }
        @keyframes pulse-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-submit {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFD700, #f5a623);
            color: #0a0a1a;
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-submit:active { transform: scale(0.97); opacity: 0.8; }
        .btn-submit:disabled { opacity: 0.4; pointer-events: none; }
        .btn-submit .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10,10,26,0.2);
            border-top-color: #0a0a1a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-submit.loading .spinner { display: inline-block; }
        .btn-submit.loading .btn-text { display: none; }

        .form-footer {
            text-align: center;
            color: #5a7a5a;
            font-size: 0.6rem;
            margin-top: 2px;
        }
        .form-footer a { color: #FFD700; text-decoration: none; font-weight: 600; cursor: pointer; }

        .zoom-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 6px 14px;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,215,0,0.12);
            z-index: 9999;
            font-family: 'Rajdhani', sans-serif;
        }
        .zoom-controls button {
            background: rgba(255,215,0,0.08);
            border: none;
            color: #FFD700;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .zoom-controls button:hover { background: rgba(255,215,0,0.2); }
        .zoom-controls .zoom-level {
            min-width: 36px;
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
        }
        .zoom-controls .reset-btn { font-size: 0.8rem; }

        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.92);
            color: #FFD700;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.12);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            z-index: 999999;
            max-width: 88%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            animation: toastIn 0.3s ease;
            pointer-events: none;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body { padding: 6px; }
            .container { padding: 14px 12px 18px; border-radius: 18px; max-height: 96vh; }
            .logo { font-size: 1.6rem; }
            .logo .v1 { font-size: 0.6rem; }
            .form-group input, .form-group select { padding: 8px 8px 8px 30px; font-size: 0.8rem; min-height: 40px; }
            .form-group i { left: 8px; font-size: 0.65rem; }
            .btn-submit { padding: 10px; font-size: 0.6rem; min-height: 40px; }
            .feature-item { font-size: 0.45rem; padding: 4px 2px; }
            .feature-item i { font-size: 0.6rem; }
            .tab-btn { font-size: 0.55rem; padding: 6px 2px; }
            .whatsapp-required { font-size: 0.6rem; padding: 6px 10px; }
        }

        @media (min-width: 769px) {
            body { padding: 30px; }
            .container { max-width: 600px; padding: 32px 36px 36px; border-radius: 28px; max-height: 95vh; }
            .logo { font-size: 2.6rem; }
            .logo .v1 { font-size: 0.9rem; }
            .logo-sub { font-size: 0.75rem; letter-spacing: 7px; }
            .feature-item { padding: 8px 4px; font-size: 0.6rem; }
            .feature-item i { font-size: 0.8rem; }
            .tab-btn { padding: 10px 12px; font-size: 0.7rem; }
            .form-group input, .form-group select { padding: 12px 14px 12px 42px; font-size: 0.9rem; min-height: 44px; }
            .form-group i { left: 12px; font-size: 0.8rem; }
            .btn-submit { padding: 14px; font-size: 0.75rem; min-height: 44px; }
            .whatsapp-required { font-size: 0.7rem; padding: 8px 14px; }
            .zoom-controls { display: flex; padding: 8px 16px; gap: 12px; }
            .zoom-controls button { font-size: 1.1rem; padding: 4px 10px; }
            .zoom-controls .zoom-level { font-size: 0.8rem; min-width: 40px; }
        }

        @media (min-width: 1024px) {
            body { padding: 40px; }
            .container { max-width: 720px; padding: 40px 48px 48px; border-radius: 32px; }
            .logo { font-size: 3.2rem; }
            .logo .v1 { font-size: 1rem; }
            .logo-sub { font-size: 0.85rem; letter-spacing: 8px; }
            .feature-item { padding: 10px 6px; font-size: 0.7rem; }
            .feature-item i { font-size: 0.9rem; }
            .tab-btn { padding: 12px 16px; font-size: 0.8rem; }
            .form-group input, .form-group select { padding: 14px 18px 14px 48px; font-size: 1rem; min-height: 48px; }
            .form-group i { left: 14px; font-size: 0.9rem; }
            .btn-submit { padding: 16px; font-size: 0.85rem; min-height: 48px; }
            .whatsapp-required { font-size: 0.75rem; padding: 10px 16px; }
            .zoom-controls { padding: 10px 20px; gap: 16px; }
            .zoom-controls button { font-size: 1.4rem; padding: 6px 14px; }
            .zoom-controls .zoom-level { font-size: 1rem; min-width: 50px; }
        }

        @media (min-width: 1440px) {
            body { padding: 60px; }
            .container { max-width: 820px; padding: 48px 56px 56px; border-radius: 36px; }
            .logo { font-size: 3.8rem; }
            .logo .v1 { font-size: 1.2rem; }
            .logo-sub { font-size: 1rem; letter-spacing: 10px; }
            .feature-item { font-size: 0.75rem; padding: 12px 8px; }
            .feature-item i { font-size: 1rem; }
            .form-group input, .form-group select { padding: 16px 20px 16px 52px; font-size: 1.05rem; min-height: 52px; }
            .form-group i { left: 16px; font-size: 1rem; }
            .btn-submit { padding: 18px; font-size: 0.9rem; min-height: 52px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">⚽ <span>FMTK</span><span class="v1">V1</span></div>
        <div class="logo-sub">Football Manager</div>
        <div class="version-badge"><i class="fas fa-circle"></i> VERSION 1.0</div>
    </div>

    <div class="features">
        <div class="feature-item"><i class="fas fa-futbol"></i> Matchs</div>
        <div class="feature-item"><i class="fas fa-chart-line"></i> Stats</div>
        <div class="feature-item"><i class="fas fa-tasks"></i> Tactique</div>
        <div class="feature-item"><i class="fas fa-users-cog"></i> Équipe</div>
        <div class="feature-item"><i class="fas fa-euro-sign"></i> Transferts</div>
        <div class="feature-item"><i class="fas fa-medal"></i> Compétitions</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">
            <i class="fas fa-sign-in-alt"></i> Connexion
        </button>
        <button class="tab-btn" data-tab="register" onclick="switchTab('register')">
            <i class="fas fa-user-plus"></i> Inscription
        </button>
    </div>

    <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group"><i class="fas fa-user"></i><input type="text" id="loginPseudo" placeholder="Pseudo" required></div>
        <div class="form-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="Mot de passe" required minlength="6"></div>
        <button type="submit" class="btn-submit" id="loginBtn"><span class="spinner"></span><span class="btn-text"><i class="fas fa-sign-in-alt"></i> Se connecter</span></button>
        <div class="form-footer">Pas encore de compte ? <a onclick="switchTab('register')">Inscrivez-vous</a></div>
    </form>

    <form class="form" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group"><i class="fas fa-flag"></i>
            <select id="countrySelect" required><option value="">🌍 Pays d'origine</option></select>
        </div>
        <div class="form-group"><i class="fas fa-user"></i><input type="text" id="registerPseudo" placeholder="Pseudo" required></div>
        <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="registerEmail" placeholder="Email" required></div>

        <div class="form-row">
            <div class="form-group" style="flex:0.35;"><i class="fas fa-phone"></i>
                <select id="prefixSelect" required><option value="">+??</option></select>
            </div>
            <div class="form-group" style="flex:0.65;"><i class="fas fa-phone" style="opacity:0;"></i>
                <input type="tel" id="whatsappInput" placeholder="WhatsApp" required>
            </div>
        </div>

        <div class="whatsapp-required">
            <i class="fas fa-exclamation-circle"></i>
            <span>⚠ WhatsApp OBLIGATOIRE - Sans WhatsApp, vous ne pourrez pas jouer !</span>
        </div>

        <div class="form-group"><i class="fas fa-lock"></i><input type="password" id="registerPassword" placeholder="Mot de passe (6 min)" required minlength="6"></div>
        <button type="submit" class="btn-submit" id="registerBtn"><span class="spinner"></span><span class="btn-text"><i class="fas fa-user-plus"></i> Créer mon compte</span></button>
        <div class="form-footer">Déjà inscrit ? <a onclick="switchTab('login')">Connectez-vous</a></div>
    </form>
</div>

<div class="zoom-controls" id="zoomControls">
    <button id="zoomOut" title="Zoom arrière (Ctrl + -)">−</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button id="zoomIn" title="Zoom avant (Ctrl + +)">+</button>
    <button id="zoomReset" class="reset-btn" title="Réinitialiser (Ctrl + 0)">⟲</button>
</div>

function loadPays() {
    const sel = document.getElementById('countrySelect');
    TOUS_LES_PAYS.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        sel.appendChild(opt);
    });
}

function loadPrefixes() {
    const sel = document.getElementById('prefixSelect');
    TOUS_LES_PREFIXES.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.code;
        opt.textContent = item.code + ' ' + item.pays;
        sel.appendChild(opt);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadPays();
    loadPrefixes();
});

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.form').forEach(f => f.classList.toggle('active', f.id === (tab === 'login' ? 'loginForm' : 'registerForm')));
}

function showToast(msg, type = 'info') {
    const colors = { success: '#2ecc71', error: '#e74c3c', warning: '#f39c12', info: '#FFD700' };
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.style.color = colors[type] || '#FFD700';
    t.style.borderColor = (colors[type] || '#FFD700') + '40';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => {
        t.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => t.remove(), 350);
    }, 2800);
}

async function callAPI(endpoint, data) {
    const r = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    return r.json();
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    const pseudo = document.getElementById('loginPseudo').value.trim();
    const password = document.getElementById('loginPassword').value;
    try {
        const res = await callAPI('/api/login', { pseudo, password });
        if (res.success) {
            showToast('✅ ' + res.message, 'success');
            setTimeout(() => window.location.href = '/session/charger', 1200);
        } else showToast('❌ ' + res.message, 'error');
    } catch { showToast('❌ Erreur de connexion', 'error'); }
    btn.classList.remove('loading');
    btn.disabled = false;
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    const pseudo = document.getElementById('registerPseudo').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const prefix = document.getElementById('prefixSelect').value;
    const whatsapp = document.getElementById('whatsappInput').value.trim();
    const password = document.getElementById('registerPassword').value;
    const country = document.getElementById('countrySelect').value;

    if (!whatsapp || whatsapp.length < 6) {
        showToast('⚠ WhatsApp est OBLIGATOIRE !', 'warning');
        btn.classList.remove('loading');
        btn.disabled = false;
        return;
    }
    if (!prefix) {
        showToast('⚠ Sélectionnez votre indicatif !', 'warning');
        btn.classList.remove('loading');
        btn.disabled = false;
        return;
    }

    try {
        const res = await callAPI('/api/register', {
            pseudo, email, whatsapp: prefix + whatsapp.replace(/\s/g, ''), password, country
        });
        if (res.success) {
            showToast('✅ ' + res.message, 'success');
            setTimeout(() => window.location.href = '/session/charger', 1200);
        } else showToast('❌ ' + res.message, 'error');
    } catch { showToast('❌ Erreur d\'inscription', 'error'); }
    btn.classList.remove('loading');
    btn.disabled = false;
}

document.querySelectorAll('.form-footer a').forEach(link => {
    link.addEventListener('click', function(e) {
        e.preventDefault();
        switchTab(this.textContent.includes('Inscrivez') ? 'register' : 'login');
    });
});

// ZOOM SUR PC
const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
if (!isMobile) {
    let zoom = 1;
    const minZoom = 0.7, maxZoom = 1.5, step = 0.05;
    function updateZoom() {
        document.body.style.zoom = zoom;
        document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
    }
    document.getElementById('zoomIn').addEventListener('click', function() {
        if (zoom < maxZoom) { zoom += step; updateZoom(); }
    });
    document.getElementById('zoomOut').addEventListener('click', function() {
        if (zoom > minZoom) { zoom -= step; updateZoom(); }
    });
    document.getElementById('zoomReset').addEventListener('click', function() {
        zoom = 1; updateZoom();
    });
    document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
            e.preventDefault();
            if (e.deltaY < 0 && zoom < maxZoom) { zoom += step; updateZoom(); }
            else if (e.deltaY > 0 && zoom > minZoom) { zoom -= step; updateZoom(); }
        }
    }, { passive: false });
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === '0') { zoom = 1; updateZoom(); e.preventDefault(); }
        if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
            if (zoom < maxZoom) { zoom += step; updateZoom(); }
            e.preventDefault();
        }
        if (e.ctrlKey && e.key === '-') {
            if (zoom > minZoom) { zoom -= step; updateZoom(); }
            e.preventDefault();
        }
    });
    document.getElementById('zoomControls').style.display = 'flex';
}
