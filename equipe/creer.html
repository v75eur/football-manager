<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Créer mon club - FMTK-v1.26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; min-height:100vh;
            font-family:'Rajdhani',sans-serif;
            background:#0a1a0a; color:#fff;
            overflow-y: auto !important;
            overflow-x: auto !important;
        }
        .container {
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:20px;
            background: linear-gradient(180deg, #0a2a0a 0%, #0d1f0d 100%);
        }
        .card {
            max-width:700px;
            width:100%;
            background:rgba(10,30,10,0.85);
            backdrop-filter:blur(20px);
            border-radius:25px;
            border:1px solid rgba(255,215,0,0.08);
            padding:35px 30px;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            font-family:'Orbitron',monospace;
            font-size:2rem;
            font-weight:900;
            color:#FFD700;
            text-align:center;
            margin-bottom:2px;
        }
        .logo-sub {
            font-size:0.7rem;
            color:#7aaa7a;
            letter-spacing:6px;
            text-transform:uppercase;
            text-align:center;
            margin-bottom:15px;
        }
        h1 {
            font-family:'Orbitron',monospace;
            font-size:1.3rem;
            color:#FFD700;
            text-align:center;
            margin-bottom:5px;
        }
        .subtitle {
            color:#8aaa8a;
            font-size:0.85rem;
            text-align:center;
            margin-bottom:20px;
        }

        .form-group {
            margin-bottom:14px;
        }
        .form-group label {
            display:block;
            color:#8aaa8a;
            font-size:0.8rem;
            margin-bottom:4px;
            font-weight:600;
            letter-spacing:0.5px;
        }
        .form-group input, .form-group select {
            width:100%;
            padding:12px 15px;
            background:rgba(255,255,255,0.05);
            border:1.5px solid rgba(255,255,255,0.06);
            border-radius:10px;
            color:#fff;
            font-size:0.9rem;
            outline:none;
            transition:border-color 0.3s;
            font-family:'Rajdhani',sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            border-color:rgba(255,215,0,0.3);
            background:rgba(255,255,255,0.08);
        }
        .form-group input::placeholder { color:#5a7a5a; }
        .form-group select option { background:#1a2e1a; color:#fff; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

        /* ===== LOGOS PRÉ-DESSINÉS ===== */
        .logos-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
            gap:10px;
            margin:10px 0;
        }
        .logo-option {
            aspect-ratio:1/1;
            border-radius:15px;
            border:2px solid rgba(255,255,255,0.05);
            cursor:pointer;
            transition:all 0.3s;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:2.2rem;
            background:rgba(255,255,255,0.02);
            position:relative;
        }
        .logo-option:hover {
            border-color:rgba(255,215,0,0.3);
            transform:scale(1.05);
        }
        .logo-option.selected {
            border-color:#FFD700;
            box-shadow:0 0 20px rgba(255,215,0,0.2);
        }
        .logo-option.selected::after {
            content:'✅';
            position:absolute;
            top:-6px;
            right:-6px;
            font-size:0.8rem;
        }
        .logo-option .bg-shape {
            position:absolute;
            inset:0;
            border-radius:13px;
            opacity:0.15;
        }
        .logo-option .icon {
            position:relative;
            z-index:1;
        }

        /* ===== PRÉVISUALISATION CLUB ===== */
        .club-preview {
            display:flex;
            align-items:center;
            gap:20px;
            padding:15px 20px;
            background:rgba(255,255,255,0.02);
            border-radius:15px;
            border:1px solid rgba(255,255,255,0.05);
            margin-bottom:10px;
            flex-wrap:wrap;
        }
        .club-preview .shield {
            width:80px;
            height:80px;
            border-radius:15px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:2rem;
            font-weight:900;
            color:#fff;
            border:2px solid rgba(255,255,255,0.1);
            transition:all 0.3s;
            flex-shrink:0;
            background:linear-gradient(135deg, #FFD700, #f5a623);
        }
        .club-preview .shield .letter {
            text-shadow:0 2px 10px rgba(0,0,0,0.3);
        }
        .club-preview .info { flex:1; min-width:150px; }
        .club-preview .info .name {
            font-size:1.2rem;
            font-weight:700;
            color:#fff;
        }
        .club-preview .info .coach {
            font-size:0.85rem;
            color:#8aaa8a;
        }
        .club-preview .info .detail {
            font-size:0.75rem;
            color:#5a7a5a;
        }

        /* ===== COULEURS ===== */
        .color-group {
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap:wrap;
        }
        .color-group input[type="color"] {
            width:45px;
            height:45px;
            padding:3px;
            border:2px solid rgba(255,255,255,0.1);
            border-radius:10px;
            background:transparent;
            cursor:pointer;
        }
        .color-group input[type="text"] {
            flex:1;
            min-width:100px;
        }

        /* ===== MAILLOT ===== */
        .kit-preview {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:20px;
            padding:15px;
            background:rgba(255,255,255,0.02);
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.05);
            flex-wrap:wrap;
        }
        .kit-preview .shirt {
            width:70px;
            height:85px;
            border-radius:10px 10px 4px 4px;
            position:relative;
            border:2px solid rgba(255,255,255,0.1);
            transition:all 0.3s;
            background:linear-gradient(135deg, #FFD700, #f5a623);
        }
        .kit-preview .shirt::before {
            content:'';
            position:absolute;
            top:12px;
            left:50%;
            transform:translateX(-50%);
            width:22px;
            height:22px;
            border-radius:50%;
            border:2px solid rgba(255,255,255,0.1);
        }
        .kit-preview .shirt .number {
            position:absolute;
            bottom:10px;
            left:50%;
            transform:translateX(-50%);
            font-size:1rem;
            font-weight:900;
            color:rgba(255,255,255,0.25);
        }
        .kit-preview .shirt .collar {
            position:absolute;
            top:-2px;
            left:50%;
            transform:translateX(-50%);
            width:22px;
            height:6px;
            border-radius:3px 3px 0 0;
            background:rgba(255,255,255,0.1);
        }
        .kit-preview .shirt .stripes {
            position:absolute;
            inset:0;
            background:repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                rgba(255,255,255,0.05) 8px,
                rgba(255,255,255,0.05) 9px
            );
            border-radius:8px 8px 2px 2px;
        }

        /* ===== BOUTON ===== */
        .btn-submit {
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg, #FFD700, #f5a623);
            color:#0a0a1a;
            font-family:'Orbitron',monospace;
            font-size:0.85rem;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
            cursor:pointer;
            transition:all 0.3s;
            margin-top:10px;
        }
        .btn-submit:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 30px rgba(255,215,0,0.2);
        }
        .btn-submit:disabled {
            opacity:0.5;
            cursor:not-allowed;
            transform:none !important;
        }

        .spinner {
            display:inline-block;
            width:18px;
            height:18px;
            border:3px solid rgba(10,10,26,0.2);
            border-top-color:#0a0a1a;
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            vertical-align:middle;
            margin-right:8px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        @media (max-width:480px) {
            .card { padding:25px 18px; }
            .form-row { grid-template-columns:1fr; }
            .logo { font-size:1.6rem; }
            h1 { font-size:1.1rem; }
            .club-preview .shield { width:60px; height:60px; font-size:1.5rem; }
            .logos-grid { grid-template-columns:repeat(auto-fill, minmax(60px, 1fr)); }
            .logo-option { font-size:1.6rem; }
        }
    </style>
</head>
<body>

                                <option value="Orlando Pirates">🇿🇦 Orlando Pirates</option>
                                <option value="Mamelodi Sundowns">🇿🇦 Mamelodi Sundowns</option>

                            <optgroup label="🌍 Europe">
                                <option value="PSG">🇫🇷 Paris Saint-Germain</option>

                                <option value="Manchester City">🇬🇧 Manchester City</option>
                                <option value="Manchester United">🇬🇧 Manchester United</option>
                                <option value="Liverpool">🇬🇧 Liverpool FC</option>
                                <option value="Arsenal">🇬🇧 Arsenal FC</option>
                                <option value="Chelsea">🇬🇧 Chelsea FC</option>
                                <option value="Bayern Munich">🇩🇪 Bayern Munich</option>
                                <option value="Dortmund">🇩🇪 Borussia Dortmund</option>
                                <option value="Juventus">🇮🇹 Juventus</option>
                                <option value="AC Milan">🇮🇹 AC Milan</option>
                                <option value="Inter Milan">🇮🇹 Inter Milan</option>
                                <option value="Benfica">🇵🇹 Benfica</option>
                                <option value="Porto">🇵🇹 FC Porto</option>
                                <option value="Ajax">🇳🇱 Ajax Amsterdam</option>
                            </optgroup>
                            <optgroup label="🌍 Amérique">
                                <option value="Flamengo">🇧🇷 Flamengo</option>
                                <option value="Palmeiras">🇧🇷 Palmeiras</option>
                                <option value="River Plate">🇦🇷 River Plate</option>
                                <option value="Boca Juniors">🇦🇷 Boca Juniors</option>
                                <option value="Club America">🇲🇽 Club América</option>
                                <option value="LA Galaxy">🇺🇸 LA Galaxy</option>
                            </optgroup>
                            <optgroup label="🌍 Asie">
                                <option value="Al Hilal">🇸🇦 Al Hilal</option>
                                <option value="Al Nassr">🇸🇦 Al Nassr</option>

                                <option value="Jeonbuk">🇰🇷 Jeonbuk Hyundai</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏆 Division</label>
                        <input type="text" id="clubDivision" placeholder="Ligue 1" value="Ligue 1">
                    </div>
                </div>

                <!-- ===== STADE ===== -->
                <div class="form-group">
                    <label>🏟️ Stade</label>
                    <input type="text" id="clubStade" placeholder="Stade de l'Amitié">
                </div>

                <!-- ===== PRÉVISUALISATION ===== -->
                <div class="form-group">
                    <label>👁️ Prévisualisation</label>
                    <div class="club-preview">
                        <div class="shield" id="logoShield" style="background:linear-gradient(135deg, #FFD700, #f5a623);">
                            <span class="letter" id="logoLetter">F</span>
                        </div>
                        <div class="info">
                            <div class="name" id="previewClubName">AS Cotonou</div>
                            <div class="coach" id="previewCoachName">Coach</div>

                <!-- ===== LOGOS PRÉ-DESSINÉS ===== -->
                <div class="form-group">
                    <label>🎨 Choisissez un logo</label>

                        </div>

                            <span class="icon">🦁</span>
                        </div>
                        <div class="logo-option" data-icon="🐉" data-bg1="#2ecc71" data-bg2="#27ae60">
                            <span class="icon">🐉</span>
                        </div>
                        <div class="logo-option" data-icon="🦅" data-bg1="#3498db" data-bg2="#2980b9">
                            <span class="icon">🦅</span>
                        </div>
                        <div class="logo-option" data-icon="🐺" data-bg1="#95a5a6" data-bg2="#7f8c8d">
                            <span class="icon">🐺</span>
                        </div>
                        <div class="logo-option" data-icon="🐘" data-bg1="#8e44ad" data-bg2="#6c3483">
                            <span class="icon">🐘</span>
                        </div>
                        <div class="logo-option" data-icon="🦓" data-bg1="#2c3e50" data-bg2="#1a252f">
                            <span class="icon">🦓</span>
                        </div>
                        <div class="logo-option" data-icon="⚡" data-bg1="#f39c12" data-bg2="#e67e22">
                            <span class="icon">⚡</span>
                        </div>

                            <span class="icon">🏆</span>
                        </div>

                <!-- ===== COULEURS LOGO ===== -->
                <div class="form-group">
                    <label>🎨 Couleurs du logo</label>
                    <div class="color-group">
                        <input type="color" id="logoColor1" value="#FFD700" onchange="updateLogo()">
                        <input type="color" id="logoColor2" value="#f5a623" onchange="updateLogo()">
                        <input type="text" id="logoColors" value="#FFD700 / #f5a623" placeholder="#FFD700 / #f5a623">
                    </div>
                </div>

                <!-- ===== MAILLOT ===== -->
                <div class="form-group">
                    <label>👕 Maillot</label>
                    <div class="kit-preview">
                        <div class="shirt" id="shirtPreview">
                            <div class="collar"></div>
                            <div class="stripes"></div>
                            <div class="number">10</div>
                        </div>
                        <div>
                            <div class="color-group" style="flex-direction:column;align-items:flex-start;gap:8px;">
                                <div style="display:flex;gap:10px;align-items:center;">
                                    <span style="color:#5a7a5a;font-size:0.75rem;">Principal</span>
                                    <input type="color" id="kitColor1" value="#FFD700" onchange="updateKit()">
                                    <span style="color:#5a7a5a;font-size:0.75rem;">Secondaire</span>
                                    <input type="color" id="kitColor2" value="#f5a623" onchange="updateKit()">
                                </div>
                                <div style="display:flex;gap:10px;align-items:center;">
                                    <span style="color:#5a7a5a;font-size:0.75rem;">Numéro</span>
                                    <input type="color" id="kitNumberColor" value="#ffffff" onchange="updateKit()">
                                </div>
                            </div>
                        </div>

                </button>

    <script>
        // ===== LOGO SELECTION =====
        document.querySelectorAll('.logo-option').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('.logo-option').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                const icon = this.dataset.icon;
                const bg1 = this.dataset.bg1;
                const bg2 = this.dataset.bg2;
                document.getElementById('logoLetter').textContent = icon;
                document.getElementById('logoColor1').value = bg1;
                document.getElementById('logoColor2').value = bg2;
                document.getElementById('logoColors').value = `${bg1} / ${bg2}`;
                updateLogo();
            });
        });

        // ===== UPDATE LOGO =====
        function updateLogo() {
            const c1 = document.getElementById('logoColor1').value;
            const c2 = document.getElementById('logoColor2').value;
            document.getElementById('logoColors').value = `${c1} / ${c2}`;
            document.getElementById('logoShield').style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
        }

        // ===== UPDATE KIT =====
        function updateKit() {
            const c1 = document.getElementById('kitColor1').value;
            const c2 = document.getElementById('kitColor2').value;
            const num = document.getElementById('kitNumberColor').value;
            document.getElementById('shirtPreview').style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
            document.getElementById('shirtPreview').querySelector('.number').style.color = num;
        }

        // ===== UPDATE PREVIEW =====
        function updatePreview() {
            const club = document.getElementById('clubSelect').value;
            const coach = document.getElementById('coachNom').value || 'Coach';
            const division = document.getElementById('clubDivision').value || 'Ligue 1';
            const stade = document.getElementById('clubStade').value || 'Stade';
            document.getElementById('previewClubName').textContent = club;
            document.getElementById('previewCoachName').textContent = coach;
            document.getElementById('previewDetail').textContent = `🏟️ ${stade} · ${division}`;
            // Mettre à jour la lettre du logo
            document.getElementById('logoLetter').textContent = document.querySelector('.logo-option.selected')?.dataset.icon || '⚽';
        }

        // ===== EVENTS =====
        document.getElementById('clubSelect').addEventListener('change', updatePreview);
        document.getElementById('coachNom').addEventListener('input', updatePreview);
        document.getElementById('clubDivision').addEventListener('input', updatePreview);
        document.getElementById('clubStade').addEventListener('input', updatePreview);

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            // Récupérer les données de session
            const saved = localStorage.getItem('fm_session_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.pseudo) {
                        document.getElementById('coachNom').value = data.pseudo;
                    }
                } catch(e) {}
            }
            updatePreview();
            updateKit();
        });

        // ===== SAVE =====
        async function saveClub(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Création...';

            const coach = document.getElementById('coachNom').value.trim();
            const club = document.getElementById('clubSelect').value;
            const division = document.getElementById('clubDivision').value.trim();
            const stade = document.getElementById('clubStade').value.trim();
            const colors = document.getElementById('logoColors').value.trim();
            const kit1 = document.getElementById('kitColor1').value;
            const kit2 = document.getElementById('kitColor2').value;
            const kitNum = document.getElementById('kitNumberColor').value;
            const logoIcon = document.querySelector('.logo-option.selected')?.dataset.icon || '⚽';

            if (!coach) {
                alert('⚠️ Veuillez entrer votre nom de coach');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
                return;
            }

            const saved = localStorage.getItem('fm_session_data');
            if (!saved) {
                alert('❌ Aucune session trouvée');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
                return;
            }

            const playerData = JSON.parse(saved);
            playerData.pseudo = coach;
            playerData.equipe.nom = club;
            playerData.equipe.division = division || 'Ligue 1';
            playerData.equipe.stade = stade || 'Mon Stade';
            playerData.equipe.couleurs = colors || '#FFD700 / #f5a623';
            playerData.equipe.logoIcon = logoIcon;
            playerData.equipe.kitColor1 = kit1;
            playerData.equipe.kitColor2 = kit2;
            playerData.equipe.kitNumberColor = kitNum;

            localStorage.setItem('fm_session_data', JSON.stringify(playerData));

            try {
                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pseudo: playerData.pseudo, data: playerData })
                });
            } catch(e) {}

            btn.innerHTML = '✅ Club créé !';
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);
        }
    </script>
</body>
</html>
