const COLOR_PALETTE = [
    '#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6',
    '#1ABC9C', '#E67E22', '#C0392B', '#2980B9', '#27AE60',

function generateLogoDesign(clubName) {
    const words = clubName.split(' ');
    let initials = '';
    const skipWords = ['FC', 'AS', 'US', 'JS', 'ES', 'CS', 'SC', 'AC', 'SD', 'UD', 'RC', 'OC', 'CA', 'de', 'la', 'du', 'des'];
    
    for (const word of words) {
        if (word.length > 0 && !skipWords.includes(word.toUpperCase())) {
            initials += word[0].toUpperCase();
        }
    }
    
    if (initials.length === 0) {
        initials = clubName.substring(0, 2).toUpperCase();
    }
    if (initials.length > 3) {
        initials = initials.substring(0, 3);
    }
    
    const colorIndex = Math.floor(Math.random() * COLOR_PALETTE.length);
    const primaryColor = COLOR_PALETTE[colorIndex];
    const secondaryColor = COLOR_PALETTE[(colorIndex + 5) % COLOR_PALETTE.length];
    const gradient = `linear-gradient(135deg, ${primaryColor}, ${secondaryColor})`;
    const glow = `${primaryColor}33`;
    
    return {
        initials: initials,
        primaryColor: primaryColor,
        secondaryColor: secondaryColor,
        gradient: gradient,
        glow: glow
    };
}

function getClubInfo(clubName) {
    if (CLUB_DATABASE[clubName]) {

        ["#FDE100", "#003366"], ["#800000", "#FFFFFF"]
    ];
    const randomColors = colors[Math.floor(Math.random() * colors.length)];
    return {
        budget: randomBudget,
        stars: stars,
        stadium: stadiums[Math.floor(Math.random() * stadiums.length)],
        capacity: capacity,
        colors: randomColors
    };
}

// ===== CHARGER LES CLUBS =====
let allClubsData = {};

async function loadClubsData() {
    const spinner = document.getElementById('loadingSpinner');
    spinner.classList.add('active');
    
    try {
        const response = await fetch('/data/clubs_complete.json');
        if (!response.ok) throw new Error('Fichier non trouvé');
        allClubsData = await response.json();
        populateCountries();
    } catch(e) {
        console.error('Erreur:', e);
        showPopup('❌', 'Erreur', 'Impossible de charger les clubs');
    } finally {
        spinner.classList.remove('active');
    }
}

function populateCountries() {
    const countrySelect = document.getElementById('countrySelect');
    countrySelect.innerHTML = '<option value="">🌍 Sélectionnez un pays</option>';
    
    const continents = {
        'UEFA': '🇪🇺 Europe',
        'CAF': '🌍 Afrique',
        'AFC': '🌏 Asie',
        'CONMEBOL': '🌎 Amérique du Sud',
        'CONCACAF': '🌎 Amérique du Nord',
        'OFC': '🌊 Océanie'
    };
    
    for (const [continent, countries] of Object.entries(allClubsData)) {
        const label = continents[continent] || continent;
        const optgroup = document.createElement('optgroup');
        optgroup.label = label;
        
        const countryList = Object.keys(countries).sort();
        for (const country of countryList) {
            const option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            optgroup.appendChild(option);
        }
        countrySelect.appendChild(optgroup);
    }
    
    countrySelect.addEventListener('change', function() {
        updateClubs();
    });
    
    // Sélectionner Bénin par défaut
    if (allClubsData.CAF && allClubsData.CAF['Bénin']) {
        countrySelect.value = 'Bénin';
        updateClubs();
    }
}

function updateClubs() {
    const country = document.getElementById('countrySelect').value;
    const division = document.getElementById('divisionSelect').value;
    const clubSelect = document.getElementById('clubSelect');
    
    clubSelect.innerHTML = '<option value="">📌 Sélectionnez un club</option>';
    clubSelect.disabled = true;
    document.getElementById('clubPreview').classList.remove('active');
    
    if (!country || !allClubsData) return;
    
    // Récupérer les clubs du pays
    let clubs = [];
    for (const [continent, countries] of Object.entries(allClubsData)) {
        if (countries[country]) {
            for (const [div, clubList] of Object.entries(countries[country])) {
                // Vérifier si la division correspond OU si "all" est sélectionné
                if (division === 'all' || div === division) {
                    for (const club of clubList) {
                        clubs.push({ name: club, division: div });
                    }
                }
            }
        }
    }
    
    if (clubs.length === 0) {
        clubSelect.innerHTML = '<option value="">⚠️ Aucun club trouvé pour ce pays</option>';
        clubSelect.disabled = true;
        return;
    }
    
    clubSelect.disabled = false;
    clubs.sort((a, b) => a.name.localeCompare(b.name));
    
    for (const club of clubs) {
        const option = document.createElement('option');
        option.value = club.name;
        const info = getClubInfo(club.name);
        const stars = '⭐'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
        const divLabel = club.division.replace('Division ', 'D');
        option.textContent = `${club.name} - ${stars} [${divLabel}]`;
        clubSelect.appendChild(option);
    }
    
    clubSelect.addEventListener('change', updatePreview);
    
    if (clubSelect.options.length > 1) {
        clubSelect.selectedIndex = 1;
        updatePreview();
    }
}

function updatePreview() {
    const club = document.getElementById('clubSelect').value;
    const division = document.getElementById('divisionSelect').value;
    const country = document.getElementById('countrySelect').value;
    
    const preview = document.getElementById('clubPreview');
    
    if (!club || club === '📌 Sélectionnez un club' || club === '⚠️ Aucun club trouvé pour ce pays') {
        preview.classList.remove('active');
        return;
    }
    
    preview.classList.add('active');
    
    const info = getClubInfo(club);
    const stars = '⭐'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
    const divNames = {'Division 1': '🏆 Division 1', 'Division 2': '🏅 Division 2', 'Division 3': '🎯 Division 3'};
    
    const logoDesign = generateLogoDesign(club);
    
    const logoElement = document.getElementById('clubLogo');
    const logoInitials = document.getElementById('logoInitials');
    
    const primaryColor = logoDesign.primaryColor;
    const secondaryColor = logoDesign.secondaryColor;
    
    logoElement.style.background = `linear-gradient(135deg, ${primaryColor}, ${secondaryColor})`;
    logoElement.style.boxShadow = `0 0 40px ${logoDesign.glow}`;
    
    const initials = club.split(' ').map(w => w[0]).join('').substring(0, 3).toUpperCase();
    logoInitials.textContent = initials;
    logoInitials.style.color = '#FFFFFF';
    logoInitials.style.fontSize = '2.5rem';
    logoInitials.style.fontWeight = '900';
    logoInitials.style.textShadow = '0 2px 20px rgba(0,0,0,0.5)';
    
    document.getElementById('previewClubName').textContent = club;
    document.getElementById('previewCountry').textContent = '🌍 ' + country;
    document.getElementById('previewStars').textContent = stars;
    document.getElementById('previewStadium').textContent = '🏟️ ' + info.stadium + ' (' + info.capacity.toLocaleString() + ' places)';
    document.getElementById('previewBudget').textContent = '💰 ' + (info.budget / 1000000).toFixed(0) + ' M€';
    document.getElementById('statCapacity').textContent = info.capacity.toLocaleString();
    document.getElementById('statDivision').textContent = divNames[division] || division || 'Division 1';
    document.getElementById('statPlayers').textContent = '25';
    
    if (info.colors && info.colors.length >= 2) {
        document.getElementById('color1').style.background = info.colors[0];
        document.getElementById('color2').style.background = info.colors[1];
    } else {
        document.getElementById('color1').style.background = primaryColor;
        document.getElementById('color2').style.background = secondaryColor;
    }
}

// ===== SOUMISSION =====
document.getElementById('teamForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VALIDATION...';
    
    const coach = document.getElementById('coachName').value.trim();
    const club = document.getElementById('clubSelect').value;
    const country = document.getElementById('countrySelect').value;
    const division = document.getElementById('divisionSelect').value;
    
    if (!coach) {
        showPopup('⚠️', 'Erreur', 'Veuillez entrer votre nom de coach');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> PRENDRE LES RÊNES';
        return;
    }
    
    if (!club || club === '📌 Sélectionnez un club' || club === '⚠️ Aucun club trouvé pour ce pays') {
        showPopup('⚠️', 'Erreur', 'Veuillez sélectionner un club');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> PRENDRE LES RÊNES';
        return;
    }
    
    const info = getClubInfo(club);
    const logoDesign = generateLogoDesign(club);
    
    const data = {
        coach: coach,
        pays: country,
        club: club,
        division: division,
        stade: info.stadium,
        budget: info.budget,
        stars: info.stars,
        capacity: info.capacity,
        colors: info.colors || ['#FFD700', '#003366'],
        logo: logoDesign.initials,
        logoColors: {
            primary: logoDesign.primaryColor,
            secondary: logoDesign.secondaryColor
        }
    };
    
    try {
        sessionStorage.setItem('fmtk_team_data', JSON.stringify(data));
        showPopup('✅', 'Félicitations ' + coach + '!', 
            `Vous êtes le nouveau manager de ${club} !\n💰 Budget: ${(info.budget/1000000).toFixed(0)} M€\n🏟️ Stade: ${info.stadium}`
        );
        setTimeout(() => {
            window.location.href = '/dashboard';
        }, 2500);
    } catch(e) {
        showPopup('❌', 'Erreur', 'Impossible de sauvegarder: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> PRENDRE LES RÊNES';
    }
});

// ===== POPUP =====
function showPopup(icon, title, message) {
    document.getElementById('popupIcon').textContent = icon;
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    document.getElementById('popup').classList.add('active');
}

function closePopup() {
    document.getElementById('popup').classList.remove('active');
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
    try {
        const sessionData = sessionStorage.getItem('fmtk_session_data');
        if (sessionData) {
            const data = JSON.parse(sessionData);
            if (data && data.pseudo) {
                document.getElementById('coachName').value = data.pseudo;
            }
        }
    } catch(e) {}
    
    loadClubsData();
});
</script>
