<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Créer mon club - FMTK-v1.26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; min-height:100vh;
            font-family:'Rajdhani',sans-serif;
            background:#0a1a0a; color:#fff;
            overflow-y: auto !important;
            overflow-x: auto !important;
        }
        .container {
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:15px;
            background: linear-gradient(180deg, #0a2a0a 0%, #0d1f0d 100%);
        }
        .card {
            max-width:600px;
            width:100%;
            background:rgba(10,30,10,0.85);
            backdrop-filter:blur(20px);
            border-radius:25px;
            border:1px solid rgba(255,215,0,0.08);
            padding:30px 25px;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            font-family:'Orbitron',monospace;
            font-size:1.8rem;
            font-weight:900;
            color:#FFD700;
            text-align:center;
        }
        .logo-sub {
            font-size:0.6rem;
            color:#7aaa7a;
            letter-spacing:6px;
            text-transform:uppercase;
            text-align:center;
            margin-bottom:15px;
        }
        h1 {
            font-family:'Orbitron',monospace;
            font-size:1.2rem;
            color:#FFD700;
            text-align:center;
            margin-bottom:5px;
        }
        .subtitle {
            color:#8aaa8a;
            font-size:0.8rem;
            text-align:center;
            margin-bottom:15px;
        }
        .form-group {
            margin-bottom:12px;
        }
        .form-group label {
            display:block;
            color:#8aaa8a;
            font-size:0.75rem;
            margin-bottom:4px;
            font-weight:600;
        }
        .form-group input, .form-group select {
            width:100%;
            padding:12px 14px;
            background:rgba(255,255,255,0.05);
            border:1.5px solid rgba(255,255,255,0.06);
            border-radius:10px;
            color:#fff;
            font-size:0.9rem;
            outline:none;
            transition:border-color 0.3s;
            font-family:'Rajdhani',sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            border-color:rgba(255,215,0,0.3);
            background:rgba(255,255,255,0.08);
        }
        .form-group input::placeholder { color:#5a7a5a; }
        .form-group select option { background:#1a2e1a; color:#fff; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .btn-submit {
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg, #FFD700, #f5a623);
            color:#0a0a1a;
            font-family:'Orbitron',monospace;
            font-size:0.85rem;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
            cursor:pointer;
            transition:all 0.3s;
            margin-top:10px;
        }
        .btn-submit:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 30px rgba(255,215,0,0.2);
        }
        .btn-submit:disabled {
            opacity:0.5;
            cursor:not-allowed;
            transform:none !important;
        }
        .spinner {
            display:inline-block;
            width:18px;
            height:18px;
            border:3px solid rgba(10,10,26,0.2);
            border-top-color:#0a0a1a;
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            vertical-align:middle;
            margin-right:8px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        .info-box {
            background:rgba(255,215,0,0.05);
            border-left:3px solid #FFD700;
            padding:10px 14px;
            border-radius:8px;
            margin-bottom:12px;
        }
        .info-box p {
            color:#8aaa8a;
            font-size:0.75rem;
            margin:3px 0;
        }
        .info-box i { color:#FFD700; margin-right:6px; }

        @media (max-width:480px) {
            .card { padding:20px 15px; }
            .form-row { grid-template-columns:1fr; }
            .logo { font-size:1.5rem; }
            h1 { font-size:1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">⚽ FMTK</div>
            <div class="logo-sub">v1.26</div>
            <h1>🏟️ Créer mon club</h1>
            <p class="subtitle">Choisissez votre club et personnalisez votre équipe</p>

            <div class="info-box">
                <p><i class="fas fa-users"></i> Votre club aura <strong>25 joueurs</strong> avec des stats détaillées</p>
                <p><i class="fas fa-coins"></i> Budget de départ : <strong>50 000 000 €</strong></p>
            </div>

            <form id="clubForm" onsubmit="saveClub(event)">
                <div class="form-group">
                    <label>🧑‍✈️ Nom du coach</label>
                    <input type="text" id="coachNom" placeholder="Votre pseudo" required>
                </div>

                <div class="form-group">
                    <label>🏷️ Club</label>
                    <select id="clubSelect">
                        <optgroup label="🌍 Afrique">
                            <option value="AS Cotonou">🇧🇯 AS Cotonou</option>
                            <option value="ASPAC FC">🇧🇯 ASPAC FC</option>
                            <option value="Buffles FC">🇧🇯 Buffles FC</option>
                            <option value="Dragons FC">🇧🇯 Dragons FC</option>
                            <option value="ASEC Mimosas">🇨🇮 ASEC Mimosas</option>
                            <option value="Africa Sports">🇨🇮 Africa Sports</option>
                            <option value="Stade Malien">🇲🇱 Stade Malien</option>
                            <option value="Djoliba AC">🇲🇱 Djoliba AC</option>
                            <option value="TP Mazembe">🇨🇩 TP Mazembe</option>
                            <option value="Al Ahly">🇪🇬 Al Ahly</option>
                            <option value="Espérance">🇹🇳 Espérance</option>
                            <option value="Raja Casablanca">🇲🇦 Raja Casablanca</option>
                            <option value="Wydad Casablanca">🇲🇦 Wydad Casablanca</option>
                            <option value="Mamelodi Sundowns">🇿🇦 Mamelodi Sundowns</option>
                        </optgroup>
                        <optgroup label="🌍 Europe">
                            <option value="PSG">🇫🇷 PSG</option>
                            <option value="Marseille">🇫🇷 Marseille</option>
                            <option value="Barcelona">🇪🇸 FC Barcelona</option>
                            <option value="Real Madrid">🇪🇸 Real Madrid</option>
                            <option value="Manchester City">🇬🇧 Manchester City</option>
                            <option value="Liverpool">🇬🇧 Liverpool</option>
                            <option value="Bayern Munich">🇩🇪 Bayern Munich</option>
                            <option value="Juventus">🇮🇹 Juventus</option>
                            <option value="AC Milan">🇮🇹 AC Milan</option>
                            <option value="Benfica">🇵🇹 Benfica</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🏴 Pays</label>
                        <select id="clubPays">
                            <option value="Bénin">🇧🇯 Bénin</option>
                            <option value="France">🇫🇷 France</option>
                            <option value="Espagne">🇪🇸 Espagne</option>
                            <option value="Angleterre">🇬🇧 Angleterre</option>
                            <option value="Allemagne">🇩🇪 Allemagne</option>
                            <option value="Italie">🇮🇹 Italie</option>
                            <option value="Portugal">🇵🇹 Portugal</option>
                            <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
                            <option value="Sénégal">🇸🇳 Sénégal</option>
                            <option value="Maroc">🇲🇦 Maroc</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏆 Division</label>
                        <input type="text" id="clubDivision" placeholder="Ligue 1" value="Ligue 1">
                    </div>
                </div>

                <div class="form-group">
                    <label>🏟️ Stade</label>
                    <input type="text" id="clubStade" placeholder="Stade de l'Amitié" value="Stade de l'Amitié">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-check"></i> Créer mon club
                </button>
            </form>
        </div>
    </div>

    <script>
        async function saveClub(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Création en cours...';

            const coach = document.getElementById('coachNom').value.trim();
            const club = document.getElementById('clubSelect').value;
            const pays = document.getElementById('clubPays').value;
            const division = document.getElementById('clubDivision').value.trim();
            const stade = document.getElementById('clubStade').value.trim();

            if (!coach) {
                alert('⚠️ Veuillez entrer votre nom de coach');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
                return;
            }

            try {
                // Récupérer les données de session
                const saved = localStorage.getItem('fm_session_data');
                let playerData = saved ? JSON.parse(saved) : {};

                // Créer les données du club
                playerData.pseudo = coach;
                playerData.equipe = {
                    nom: club,
                    pays: pays,
                    division: division || 'Ligue 1',
                    stade: stade || 'Mon Stade',
                    budget: 50000000,
                    joueurs: []
                };

                // Générer 25 joueurs pour le club
                const response = await fetch('/api/generate_players', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        pays: pays, 
                        club: club, 
                        nombre: 25 
                    })
                });

                const result = await response.json();
                if (result.success) {
                    playerData.equipe.joueurs = result.players;
                } else {
                    // Fallback : générer des joueurs locaux
                    playerData.equipe.joueurs = generateLocalPlayers(pays, club, 25);
                }

                // Sauvegarder
                localStorage.setItem('fm_session_data', JSON.stringify(playerData));

                // Sauvegarder sur le serveur
                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        pseudo: playerData.pseudo, 
                        data: playerData 
                    })
                });

                btn.innerHTML = '✅ Club créé !';
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);

            } catch(e) {
                console.error(e);
                alert('❌ Erreur lors de la création du club');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
            }
        }

        // Fallback : générer des joueurs localement
        function generateLocalPlayers(pays, club, nombre) {
            const postes = ['Gardien', 'Défenseur', 'Milieu', 'Attaquant'];
            const noms = {
                'Bénin': ['Mounié', 'Dossou', 'Hountondji', 'Adénon', 'Gestede'],
                'France': ['Martin', 'Bernard', 'Dubois', 'Petit', 'Garcia'],
                'Espagne': ['García', 'Rodríguez', 'González', 'Martínez', 'López'],
                'Angleterre': ['Smith', 'Jones', 'Williams', 'Taylor', 'Davies'],
                'Allemagne': ['Müller', 'Schmidt', 'Schneider', 'Fischer', 'Weber'],
                'Italie': ['Rossi', 'Russo', 'Ferrari', 'Esposito', 'Bianchi']
            };
            const prenoms = {
                'Bénin': ['Steve', 'Jodel', 'Cédric', 'Sessi', 'Marcel'],
                'France': ['Jean', 'Pierre', 'Paul', 'Jacques', 'Antoine'],
                'Espagne': ['Antonio', 'José', 'Manuel', 'Javier', 'Francisco'],
                'Angleterre': ['James', 'John', 'William', 'George', 'Henry'],
                'Allemagne': ['Hans', 'Peter', 'Klaus', 'Dieter', 'Uwe'],
                'Italie': ['Marco', 'Alessandro', 'Francesco', 'Luca', 'Matteo']
            };

            const paysNoms = noms[pays] || noms['France'];
            const paysPrenoms = prenoms[pays] || prenoms['France'];
            const joueurs = [];

            for (let i = 0; i < nombre; i++) {
                const nom = paysNoms[i % paysNoms.length];
                const prenom = paysPrenoms[i % paysPrenoms.length];
                const note = Math.floor(Math.random() * 50) + 40; // 40-90
                const age = Math.floor(Math.random() * 10) + 16; // 16-26

                joueurs.push({
                    id: `joueur_${i}`,
                    prenom: prenom,
                    nom: nom,
                    age: age,
                    poste: postes[i % postes.length],
                    note: note,
                    valeur: note * 100000,
                    attributs: {
                        vitesse: Math.floor(Math.random() * 50) + 40,
                        tir: Math.floor(Math.random() * 50) + 30,
                        passe: Math.floor(Math.random() * 50) + 30,
                        defense: Math.floor(Math.random() * 50) + 30,
                        physique: Math.floor(Math.random() * 50) + 40
                    }
                });
            }
            return joueurs;
        }
    </script>
</body>
</html>
