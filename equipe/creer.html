<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Créer mon équipe - FMTK-v1.26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; min-height:100vh; font-family:'Rajdhani',sans-serif; background:#0a1a0a; color:#fff; overflow-y:auto !important; overflow-x:auto !important; }
        .container { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:15px; background:linear-gradient(180deg,#0a2a0a 0%,#0d1f0d 100%); }
        .card { max-width:650px; width:100%; background:rgba(10,30,10,0.85); backdrop-filter:blur(20px); border-radius:25px; border:1px solid rgba(255,215,0,0.08); padding:30px 25px; box-shadow:0 20px 60px rgba(0,0,0,0.8); }
        .logo { font-family:'Orbitron',monospace; font-size:1.8rem; font-weight:900; color:#FFD700; text-align:center; }
        .logo-sub { font-size:0.6rem; color:#7aaa7a; letter-spacing:6px; text-transform:uppercase; text-align:center; margin-bottom:15px; }
        h1 { font-family:'Orbitron',monospace; font-size:1.2rem; color:#FFD700; text-align:center; margin-bottom:5px; }
        .subtitle { color:#8aaa8a; font-size:0.8rem; text-align:center; margin-bottom:15px; }
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; color:#8aaa8a; font-size:0.75rem; margin-bottom:4px; font-weight:600; }
        .form-group input, .form-group select { width:100%; padding:12px 14px; background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.06); border-radius:10px; color:#fff; font-size:0.9rem; outline:none; transition:border-color 0.3s; font-family:'Rajdhani',sans-serif; }
        .form-group input:focus, .form-group select:focus { border-color:rgba(255,215,0,0.3); background:rgba(255,255,255,0.08); }
        .form-group input::placeholder { color:#5a7a5a; }
        .form-group select option { background:#1a2e1a; color:#fff; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .btn-submit { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#FFD700,#f5a623); color:#0a0a1a; font-family:'Orbitron',monospace; font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer; transition:all 0.3s; margin-top:10px; }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,215,0,0.2); }
        .btn-submit:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }
        .spinner { display:inline-block; width:18px; height:18px; border:3px solid rgba(10,10,26,0.2); border-top-color:#0a0a1a; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .info-box { background:rgba(255,215,0,0.05); border-left:3px solid #FFD700; padding:10px 14px; border-radius:8px; margin-bottom:12px; }
        .info-box p { color:#8aaa8a; font-size:0.75rem; margin:3px 0; }
        .info-box i { color:#FFD700; margin-right:6px; }
        .preview-club { background:rgba(255,255,255,0.02); border-radius:12px; padding:15px; margin-bottom:15px; border:1px solid rgba(255,255,255,0.05); text-align:center; }
        .preview-club .name { font-size:1.3rem; font-weight:700; color:#FFD700; }
        .preview-club .details { color:#8aaa8a; font-size:0.8rem; margin-top:4px; }
        .preview-club .details i { margin:0 6px; }
        @media (max-width:480px) { .card { padding:20px 15px; } .form-row { grid-template-columns:1fr; } .logo { font-size:1.5rem; } h1 { font-size:1rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">⚽ FMTK</div>
            <div class="logo-sub">v1.26</div>
            <h1>🏟️ Créer mon équipe</h1>
            <p class="subtitle">Choisissez votre pays, votre division et votre club</p>
            <div class="info-box">
                <p><i class="fas fa-users"></i> Votre équipe aura <strong>25 joueurs</strong> avec des stats détaillées</p>
                <p><i class="fas fa-coins"></i> Budget de départ : <strong>50 000 000 €</strong></p>
            </div>
            <div class="preview-club" id="previewClub">
                <div class="name" id="previewName">⚽ Mon Club</div>
                <div class="details"><i class="fas fa-flag"></i> <span id="previewPays">Pays</span> <i class="fas fa-trophy"></i> <span id="previewDivision">Division</span> <i class="fas fa-home"></i> <span id="previewStade">Stade</span></div>
            </div>
            <form id="clubForm" onsubmit="saveClub(event)">
                <div class="form-group">
                    <label>🧑‍✈️ Nom du coach</label>
                    <input type="text" id="coachNom" placeholder="Votre pseudo" required>
                </div>
                <div class="form-group">
                    <label>🏴 Pays</label>
                    <select id="clubPays" onchange="updateClubs()">
                        <!-- Pays chargés dynamiquement -->
                    </select>
                </div>
                <div class="form-group">
                    <label>🏆 Division</label>
                    <select id="clubDivisionSelect" onchange="updateClubs()">
                        <option value="D1">Division 1</option>
                        <option value="D2">Division 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🏷️ Club</label>
                    <select id="clubSelect"></select>
                </div>
                <div class="form-group">
                    <label>🏟️ Stade</label>
                    <input type="text" id="clubStade" placeholder="Camp Nou" value="Camp Nou">
                </div>
                <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-check"></i> Créer mon équipe</button>
            </form>
        </div>
    </div>

    <script>
        // ===== CHARGER LES CLUBS DEPUIS LE FICHIER JSON =====
        let allClubsData = {};

        async function loadClubsData() {
            try {
                const response = await fetch('/data/clubs_complete.json');
                const data = await response.json();
                allClubsData = data;
                populateCountries();
            } catch(e) {
                console.error('Erreur chargement clubs:', e);
                // Fallback
                allClubsData = {
                    "Europe": {
                        "France": {"Ligue 1": ["PSG", "Marseille", "Lyon"]},
                        "Espagne": {"La Liga": ["Barcelona", "Real Madrid"]}
                    }
                };
                populateCountries();
            }
        }

        function populateCountries() {
            const select = document.getElementById('clubPays');
            select.innerHTML = '';
            
            for (const [continent, countries] of Object.entries(allClubsData)) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = `🌍 ${continent}`;
                
                for (const country of Object.keys(countries)) {
                    const option = document.createElement('option');
                    option.value = country;
                    option.textContent = country;
                    optgroup.appendChild(option);
                }
                select.appendChild(optgroup);
            }
            
            // Sélectionner le premier pays par défaut
            const firstContinent = Object.keys(allClubsData)[0];
            if (firstContinent) {
                const firstCountry = Object.keys(allClubsData[firstContinent] || {})[0];
                if (firstCountry) {
                    select.value = firstCountry;
                }
            }
            updateClubs();
        }

        function updateClubs() {
            const pays = document.getElementById('clubPays').value;
            const division = document.getElementById('clubDivisionSelect').value;
            const select = document.getElementById('clubSelect');
            select.innerHTML = '';
            
            let clubs = [];
            
            // Chercher les clubs pour ce pays et cette division
            for (const [continent, countries] of Object.entries(allClubsData)) {
                if (countries[pays]) {
                    // Si division = D1, prendre la première ligue, D2 la deuxième
                    const ligues = Object.keys(countries[pays]);
                    if (division === 'D1' && ligues.length > 0) {
                        clubs = countries[pays][ligues[0]] || [];
                    } else if (division === 'D2' && ligues.length > 1) {
                        clubs = countries[pays][ligues[1]] || [];
                    } else if (division === 'D2' && ligues.length === 1) {
                        // Si pas de D2, générer des clubs fictifs
                        clubs = generateFakeClubs(pays, 'D2');
                    }
                    break;
                }
            }
            
            if (clubs.length === 0) {
                clubs = generateFakeClubs(pays, division);
            }
            
            clubs.forEach(club => {
                const option = document.createElement('option');
                option.value = club;
                option.textContent = club;
                select.appendChild(option);
            });
            
            updatePreview();
        }

        function generateFakeClubs(pays, division) {
            const suffixes = ["FC", "AS", "US", "ES", "SC", "AC", "JS"];
            const clubs = [];
            const city = pays.substring(0, 6);
            for (let i = 0; i < 8; i++) {
                const suffix = suffixes[i % suffixes.length];
                clubs.push(`${suffix} ${city} ${division === 'D1' ? 'United' : 'City'}`);
            }
            return clubs;
        }

        function updatePreview() {
            const club = document.getElementById('clubSelect').value;
            const pays = document.getElementById('clubPays').value;
            const division = document.getElementById('clubDivisionSelect').value;
            const stade = document.getElementById('clubStade').value || 'Stade';
            const coach = document.getElementById('coachNom').value || 'Coach';
            document.getElementById('previewName').textContent = '⚽ ' + club;
            document.getElementById('previewPays').textContent = pays;
            document.getElementById('previewDivision').textContent = division;
            document.getElementById('previewStade').textContent = stade;
        }

        document.getElementById('clubPays').addEventListener('change', updateClubs);
        document.getElementById('clubDivisionSelect').addEventListener('change', updateClubs);
        document.getElementById('clubSelect').addEventListener('change', updatePreview);
        document.getElementById('clubStade').addEventListener('input', updatePreview);
        document.getElementById('coachNom').addEventListener('input', updatePreview);

        document.addEventListener('DOMContentLoaded', function() {
            const saved = localStorage.getItem('fm_session_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.pseudo) document.getElementById('coachNom').value = data.pseudo;
                } catch(e) {}
            }
            loadClubsData();
        });

        async function saveClub(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Création en cours...';

            const coach = document.getElementById('coachNom').value.trim();
            const club = document.getElementById('clubSelect').value;
            const pays = document.getElementById('clubPays').value;
            const division = document.getElementById('clubDivisionSelect').value;
            const stade = document.getElementById('clubStade').value.trim();

            if (!coach) {
                alert('⚠️ Veuillez entrer votre nom de coach');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon équipe';
                return;
            }

            try {
                const saved = localStorage.getItem('fm_session_data');
                let playerData = saved ? JSON.parse(saved) : {};
                playerData.pseudo = coach;
                playerData.equipe = { nom: club, pays: pays, division: division || 'Ligue 1', stade: stade || 'Mon Stade', budget: 50000000, joueurs: [] };

                const response = await fetch('/api/generate_players', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pays: pays, club: club, nombre: 25 })
                });
                const result = await response.json();
                if (result.success) {
                    playerData.equipe.joueurs = result.players;
                } else {
                    playerData.equipe.joueurs = generateLocalPlayers(pays, club, 25);
                }

                localStorage.setItem('fm_session_data', JSON.stringify(playerData));
                await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pseudo: playerData.pseudo, data: playerData }) });

                btn.innerHTML = '✅ Équipe créée !';
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
            } catch(e) {
                alert('❌ Erreur lors de la création de l\'équipe');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon équipe';
            }
        }

        function generateLocalPlayers(pays, club, nombre) {
            const postes = ['Gardien', 'Défenseur', 'Milieu', 'Attaquant'];
            const noms = {'France': ['Martin','Bernard','Dubois','Petit','Garcia'],'Espagne': ['García','Rodríguez','González','Martínez','López'],'Angleterre': ['Smith','Jones','Williams','Taylor','Davies'],'Allemagne': ['Müller','Schmidt','Schneider','Fischer','Weber'],'Italie': ['Rossi','Russo','Ferrari','Esposito','Bianchi'],'Brésil': ['Silva','Santos','Oliveira','Pereira','Souza'],'Argentine': ['González','García','Fernández','López','Martínez']};
            const prenoms = {'France': ['Jean','Pierre','Paul','Jacques','Antoine'],'Espagne': ['Antonio','José','Manuel','Javier','Francisco'],'Angleterre': ['James','John','William','George','Henry'],'Allemagne': ['Hans','Peter','Klaus','Dieter','Uwe'],'Italie': ['Marco','Alessandro','Francesco','Luca','Matteo'],'Brésil': ['André','Carlos','José','Luiz','Paulo'],'Argentine': ['Juan','Carlos','José','Luis','Diego']};
            const paysNoms = noms[pays] || noms['France'];
            const paysPrenoms = prenoms[pays] || prenoms['France'];
            const joueurs = [];
            for (let i = 0; i < nombre; i++) {
                const nom = paysNoms[i % paysNoms.length];
                const prenom = paysPrenoms[i % paysPrenoms.length];
                const note = Math.floor(Math.random() * 50) + 40;
                const age = Math.floor(Math.random() * 10) + 16;
                joueurs.push({ id: 'joueur_' + i, prenom: prenom, nom: nom, age: age, poste: postes[i % postes.length], note: note, valeur: note * 100000, attributs: { vitesse: Math.floor(Math.random() * 50) + 40, tir: Math.floor(Math.random() * 50) + 30, passe: Math.floor(Math.random() * 50) + 30, defense: Math.floor(Math.random() * 50) + 30, physique: Math.floor(Math.random() * 50) + 40 } });
            }
            return joueurs;
        }
    </script>
</body>
</html>
<script>
// ===== RÉCUPÉRER LES DONNÉES DE SESSION =====
document.addEventListener('DOMContentLoaded', function() {
    // Récupérer depuis l'URL
    const params = new URLSearchParams(window.location.search);
    const pseudo = params.get('pseudo');
    const playerId = params.get('player_id');
    
    // Récupérer depuis sessionStorage
    try {
        const sessionData = sessionStorage.getItem('fmtk_session_data');
        if (sessionData) {
            const data = JSON.parse(sessionData);
            if (data && data.pseudo) {
                document.getElementById('coachNom').value = data.pseudo;
                console.log('✅ Données de session chargées:', data.pseudo);
            }
        }
    } catch(e) {
        console.warn('Impossible de charger sessionStorage', e);
    }
    
    // Remplir le pseudo
    if (pseudo) {
        document.getElementById('coachNom').value = pseudo;
    }
});
</script>
