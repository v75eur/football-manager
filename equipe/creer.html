        }

            border-color: #FFD700;

        }

            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            background: transparent;
            flex-shrink: 0;
        }
        .color-input-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        .color-input-wrapper input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .color-input-wrapper .color-hex {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.85rem;
            font-family: 'Rajdhani', sans-serif;
            padding: 8px 0;
            min-width: 60px;
        }
        .color-input-wrapper .color-hex:focus {
            outline: none;
        }
        .color-preview {
            width: 30px;
            height: 30px;

            flex-shrink: 0;
            transition: all 0.3s;

<script>
// ===== GESTION DES COULEURS =====
function initColorPickers() {
    // Couleur principale
    const primaryInput = document.getElementById('primaryColor');
    const primaryHex = document.getElementById('primaryColorHex');
    const primaryPreview = document.getElementById('primaryColorPreview');
    const primaryPresets = document.querySelectorAll('#primaryPresets .color-preset');
    
    primaryInput.addEventListener('input', function() {
        const color = this.value;
        primaryHex.value = color;
        primaryPreview.style.background = color;
        updatePresetActive('#primaryPresets', color);
        updatePreview();
    });
    
    primaryHex.addEventListener('input', function() {
        const color = this.value;
        if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
            primaryInput.value = color;
            primaryPreview.style.background = color;
            updatePresetActive('#primaryPresets', color);
            updatePreview();
        }
    });
    
    primaryPresets.forEach(preset => {
        preset.addEventListener('click', function() {
            const color = this.dataset.color;
            primaryInput.value = color;
            primaryHex.value = color;
            primaryPreview.style.background = color;
            updatePresetActive('#primaryPresets', color);
            updatePreview();
        });
    });
    
    // Couleur secondaire
    const secondaryInput = document.getElementById('secondaryColor');
    const secondaryHex = document.getElementById('secondaryColorHex');
    const secondaryPreview = document.getElementById('secondaryColorPreview');
    const secondaryPresets = document.querySelectorAll('#secondaryPresets .color-preset');
    
    secondaryInput.addEventListener('input', function() {
        const color = this.value;
        secondaryHex.value = color;
        secondaryPreview.style.background = color;
        updatePresetActive('#secondaryPresets', color);
        updatePreview();
    });
    
    secondaryHex.addEventListener('input', function() {
        const color = this.value;
        if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
            secondaryInput.value = color;
            secondaryPreview.style.background = color;
            updatePresetActive('#secondaryPresets', color);
            updatePreview();
        }
    });
    
    secondaryPresets.forEach(preset => {
        preset.addEventListener('click', function() {
            const color = this.dataset.color;
            secondaryInput.value = color;
            secondaryHex.value = color;
            secondaryPreview.style.background = color;
            updatePresetActive('#secondaryPresets', color);
            updatePreview();
        });
    });
}

function updatePresetActive(selector, color) {
    document.querySelectorAll(selector + ' .color-preset').forEach(p => {
        p.classList.toggle('active', p.dataset.color.toLowerCase() === color.toLowerCase());
    });
}

function getClubInfo(clubName) {
    if (CLUB_DATABASE[clubName]) {
        return CLUB_DATABASE[clubName];
    }
    const randomBudget = Math.floor(Math.random() * 90000000) + 10000000;
    const stars = Math.floor(Math.random() * 3) + 1;
    const capacities = [1000, 2000, 3000, 5000, 8000, 10000, 15000, 20000];
    const capacity = capacities[Math.floor(Math.random() * capacities.length)];
    const stadiums = [
        `Stade ${clubName.split(' ').pop()}`,
        `${clubName} Arena`,
        `Parc des ${clubName.split(' ').pop()}s`,
        `Stade Municipal de ${clubName.split(' ').pop()}`
    ];
    return {
        budget: randomBudget,
        stars: stars,
        stadium: stadiums[Math.floor(Math.random() * stadiums.length)],
        capacity: capacity
    };
}

    spinner.classList.add('active');
    
    try {
        const response = await fetch('/data/clubs_complete.json');
        if (!response.ok) throw new Error('Fichier non trouvé');
        allClubsData = await response.json();
        populateCountries();
    } catch(e) {
        console.error('Erreur:', e);
        showPopup('❌', 'Erreur', 'Impossible de charger les clubs');
    } finally {
        spinner.classList.remove('active');
    }
}

function populateCountries() {
    const countrySelect = document.getElementById('countrySelect');
    countrySelect.innerHTML = '<option value="">🌍 Sélectionnez un pays</option>';
    
    const continents = {
        'UEFA': '🇪🇺 Europe',
        'CAF': '🌍 Afrique',
        'AFC': '🌏 Asie',
        'CONMEBOL': '🌎 Amérique du Sud',
        'CONCACAF': '🌎 Amérique du Nord',
        'OFC': '🌊 Océanie'
    };
    
    for (const [continent, countries] of Object.entries(allClubsData)) {
        const label = continents[continent] || continent;
        const optgroup = document.createElement('optgroup');
        optgroup.label = label;
        
        for (const country of Object.keys(countries).sort()) {
            const option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            optgroup.appendChild(option);
        }
        countrySelect.appendChild(optgroup);
    }
    
    countrySelect.addEventListener('change', updateClubs);
    // Sélectionner Bénin par défaut si disponible
    if (allClubsData.CAF && allClubsData.CAF['Bénin']) {
        countrySelect.value = 'Bénin';
    }
    updateClubs();
}

function updateClubs() {
    const country = document.getElementById('countrySelect').value;
    const clubSelect = document.getElementById('clubSelect');
    
    clubSelect.innerHTML = '<option value="">📌 Sélectionnez un club</option>';
    clubSelect.disabled = true;
    document.getElementById('previewCard').classList.remove('active');
    
    if (!country || !allClubsData) return;
    
    const clubs = [];
    for (const [continent, countries] of Object.entries(allClubsData)) {
        if (countries[country]) {
            for (const [division, clubList] of Object.entries(countries[country])) {
                for (const club of clubList) {
                    clubs.push({ name: club, division: division });
                }
            }
        }
    }
    
    if (clubs.length === 0) {
        clubSelect.innerHTML = '<option value="">⚠️ Aucun club trouvé</option>';
        clubSelect.disabled = true;
        return;
    }
    
    clubSelect.disabled = false;
    clubs.sort((a, b) => a.name.localeCompare(b.name));
    
    const divNames = {'D1': '🏆 Division 1', 'D2': '🏅 Division 2', 'D3': '🎯 Division 3'};
    
    for (const club of clubs) {
        const option = document.createElement('option');
        option.value = club.name;
        const info = getClubInfo(club.name);
        const stars = '⭐'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
        option.textContent = `${club.name} - ${stars} ${(info.budget / 1000000).toFixed(0)}M€`;
        option.dataset.division = club.division;
        clubSelect.appendChild(option);
    }
    
    clubSelect.addEventListener('change', updatePreview);
    document.getElementById('teamName').addEventListener('input', updatePreview);
    document.getElementById('divisionSelect').addEventListener('change', updatePreview);
    document.getElementById('stadium').addEventListener('input', updatePreview);
    
    if (clubSelect.options.length > 1) {
        clubSelect.selectedIndex = 1;
        updatePreview();
    }
}

function updatePreview() {
    const club = document.getElementById('clubSelect').value;
    const teamName = document.getElementById('teamName').value || 'Nom de l\'équipe';
    const division = document.getElementById('divisionSelect').value;
    const country = document.getElementById('countrySelect').value;
    const primaryColor = document.getElementById('primaryColor').value;
    const secondaryColor = document.getElementById('secondaryColor').value;
    const stadium = document.getElementById('stadium').value;
    
    const previewCard = document.getElementById('previewCard');
    const previewContent = document.getElementById('previewContent');
    
    if (!club || club === '📌 Sélectionnez un club') {
        previewCard.classList.remove('active');
        return;
    }
    
    previewCard.classList.add('active');
    
    const info = getClubInfo(club);
    const stars = '⭐'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
    const divNames = {'D1': '🏆 Division 1', 'D2': '🏅 Division 2', 'D3': '🎯 Division 3'};
    const budgetDisplay = (info.budget / 1000000).toFixed(0);
    const budgetClass = info.budget > 500000000 ? '' : 'small';
    
    // Stade
    let stadiumDisplay = stadium || info.stadium || `${club} Stadium`;
    
    previewContent.innerHTML = `
        <div class="preview-item"><span>🏷️ Nom</span><span>${teamName}</span></div>
        <div class="preview-item"><span>🌍 Pays</span><span>${country}</span></div>
        <div class="preview-item"><span>⚽ Club</span><span>${club}</span></div>
        <div class="preview-item"><span>⭐ Niveau</span><span class="preview-stars">${stars}</span></div>
        <div class="preview-item"><span>💰 Budget</span><span class="preview-budget ${budgetClass}">${budgetDisplay} M€</span></div>
        <div class="preview-item"><span>🏅 Division</span><span>${divNames[division] || division}</span></div>
        <div class="preview-item"><span>🏟️ Stade</span><span>${stadiumDisplay} (${info.capacity || '?'} places)</span></div>
        <div class="preview-item"><span>🎨 Couleurs</span>
            <span class="preview-colors">
                <span class="color-dot" style="background:${primaryColor};"></span>
                <span>+</span>
                <span class="color-dot" style="background:${secondaryColor};"></span>
                <span style="font-size:0.7rem;color:#666;">${primaryColor} / ${secondaryColor}</span>
            </span>
        </div>
        <div class="preview-item" style="border-bottom:none;padding-top:8px;margin-top:4px;border-top:1px solid rgba(255,215,0,0.1);">
            <span style="color:#FFD700;">⚡ Effectif</span>
            <span style="color:#2ecc71;">25 joueurs</span>
        </div>
    `;
    
    // Mettre à jour le stade si vide
    if (!document.getElementById('stadium').value) {
        document.getElementById('stadium').value = info.stadium || `${club} Stadium`;
    }
}

// ===== SOUMISSION =====
document.getElementById('teamForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CRÉATION...';
    
    const club = document.getElementById('clubSelect').value;
    const info = getClubInfo(club);
    const data = {
        nom: document.getElementById('teamName').value,
        pays: document.getElementById('countrySelect').value,
        club: club,
        division: document.getElementById('divisionSelect').value,
        stade: document.getElementById('stadium').value || info.stadium,
        couleur1: document.getElementById('primaryColor').value,
        couleur2: document.getElementById('secondaryColor').value,
        budget: info.budget,
        stars: info.stars,
        capacity: info.capacity
    };
    
    try {
        sessionStorage.setItem('fmtk_team_data', JSON.stringify(data));
        showPopup('✅', 'Équipe créée !', 
            `🎉 ${data.nom} est prêt !\n💰 Budget: ${(data.budget/1000000).toFixed(0)} M€\n🎨 Couleurs: ${data.couleur1} / ${data.couleur2}`
        );
        setTimeout(() => {
            window.location.href = '/dashboard';
        }, 2500);
    } catch(e) {
        showPopup('❌', 'Erreur', 'Impossible de créer l\'équipe: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> CRÉER MON ÉQUIPE';
    }
});

// ===== POPUP =====
function showPopup(icon, title, message) {
    document.getElementById('popupIcon').textContent = icon;
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    document.getElementById('popup').classList.add('active');
}

function closePopup() {
    document.getElementById('popup').classList.remove('active');
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
    // Récupérer le pseudo depuis la session
    try {
        const sessionData = sessionStorage.getItem('fmtk_session_data');
        if (sessionData) {
            const data = JSON.parse(sessionData);
            if (data && data.pseudo) {
                document.getElementById('teamName').value = data.pseudo + ' FC';
            }
        }
    } catch(e) {}
    
    initColorPickers();
    loadClubsData();
});
</script>
</body>
