<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Créer mon club - FMTK-v1.26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; min-height:100vh;
            font-family:'Rajdhani',sans-serif;
            background:#0a1a0a; color:#fff;
            overflow-y: auto !important;
            overflow-x: auto !important;
        }
        .container {
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:20px;
            background: linear-gradient(180deg, #0a2a0a 0%, #0d1f0d 100%);
        }
        .card {
            max-width:600px;
            width:100%;
            background:rgba(10,30,10,0.85);
            backdrop-filter:blur(20px);
            border-radius:25px;
            border:1px solid rgba(255,215,0,0.08);
            padding:35px 30px;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            font-family:'Orbitron',monospace;
            font-size:2rem;
            font-weight:900;
            color:#FFD700;
            text-align:center;
            margin-bottom:2px;
        }
        .logo-sub {
            font-size:0.7rem;
            color:#7aaa7a;
            letter-spacing:6px;
            text-transform:uppercase;
            text-align:center;
            margin-bottom:15px;
        }
        h1 {
            font-family:'Orbitron',monospace;
            font-size:1.3rem;
            color:#FFD700;
            text-align:center;
            margin-bottom:5px;
        }
        .subtitle {
            color:#8aaa8a;
            font-size:0.85rem;
            text-align:center;
            margin-bottom:20px;
        }
        .form-group {
            margin-bottom:14px;
        }
        .form-group label {
            display:block;
            color:#8aaa8a;
            font-size:0.8rem;
            margin-bottom:4px;
            font-weight:600;
        }
        .form-group input, .form-group select {
            width:100%;
            padding:12px 15px;
            background:rgba(255,255,255,0.05);
            border:1.5px solid rgba(255,255,255,0.06);
            border-radius:10px;
            color:#fff;
            font-size:0.9rem;
            outline:none;
            transition:border-color 0.3s;
            font-family:'Rajdhani',sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            border-color:rgba(255,215,0,0.3);
            background:rgba(255,255,255,0.08);
        }
        .form-group input::placeholder {
            color:#5a7a5a;
        }
        .form-group select option {
            background:#1a2e1a;
            color:#fff;
        }
        .form-row {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        /* ===== LOGO PREVIEW ===== */
        .logo-preview {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:15px;
            padding:15px;
            background:rgba(255,255,255,0.02);
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.05);
            margin-bottom:10px;
            flex-wrap:wrap;
        }
        .logo-preview .shield {
            width:80px;
            height:80px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:2.2rem;
            font-weight:900;
            color:#fff;
            border:3px solid rgba(255,255,255,0.2);
            transition:all 0.3s;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
        }
        .logo-preview .shield .letter {
            text-shadow:0 2px 10px rgba(0,0,0,0.3);
        }
        .logo-preview .info {
            text-align:left;
        }
        .logo-preview .info .club-name {
            font-size:1.1rem;
            font-weight:700;
            color:#fff;
        }
        .logo-preview .info .coach-name {
            font-size:0.85rem;
            color:#8aaa8a;
        }
        .logo-preview .info .colors {
            font-size:0.75rem;
            color:#5a7a5a;
            margin-top:2px;
        }

        /* ===== COULEURS ===== */
        .color-picker-group {
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap:wrap;
        }
        .color-picker-group input[type="color"] {
            width:50px;
            height:50px;
            padding:3px;
            border:2px solid rgba(255,255,255,0.1);
            border-radius:10px;
            background:transparent;
            cursor:pointer;
        }
        .color-picker-group input[type="text"] {
            flex:1;
            min-width:100px;
        }
        .color-swatch {
            display:inline-block;
            width:30px;
            height:30px;
            border-radius:6px;
            border:1px solid rgba(255,255,255,0.1);
        }

        /* ===== MAILLOT ===== */
        .kit-preview {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:20px;
            padding:15px;
            background:rgba(255,255,255,0.02);
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.05);
            flex-wrap:wrap;
        }
        .kit-preview .shirt {
            width:60px;
            height:75px;
            border-radius:8px 8px 4px 4px;
            position:relative;
            border:2px solid rgba(255,255,255,0.1);
            transition:all 0.3s;
        }
        .kit-preview .shirt::before {
            content:'';
            position:absolute;
            top:10px;
            left:50%;
            transform:translateX(-50%);
            width:20px;
            height:20px;
            border-radius:50%;
            border:2px solid rgba(255,255,255,0.1);
        }
        .kit-preview .shirt .number {
            position:absolute;
            bottom:8px;
            left:50%;
            transform:translateX(-50%);
            font-size:0.9rem;
            font-weight:900;
            color:rgba(255,255,255,0.3);
        }
        .kit-preview .shirt .collar {
            position:absolute;
            top:-2px;
            left:50%;
            transform:translateX(-50%);
            width:20px;
            height:6px;
            border-radius:3px 3px 0 0;
            background:rgba(255,255,255,0.1);
        }

        .btn-submit {
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg, #FFD700, #f5a623);
            color:#0a0a1a;
            font-family:'Orbitron',monospace;
            font-size:0.85rem;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
            cursor:pointer;
            transition:all 0.3s;
            margin-top:10px;
        }
        .btn-submit:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 30px rgba(255,215,0,0.2);
        }
        .btn-submit:disabled {
            opacity:0.5;
            cursor:not-allowed;
            transform:none !important;
        }

        @media (max-width:480px) {
            .card { padding:25px 18px; }
            .form-row { grid-template-columns:1fr; }
            .logo { font-size:1.6rem; }
            h1 { font-size:1.1rem; }
            .logo-preview .shield { width:60px; height:60px; font-size:1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">⚽ FMTK</div>
            <div class="logo-sub">v1.26</div>
            <h1>🏟️ Créer mon club</h1>
            <p class="subtitle">Configurez votre équipe pour commencer l'aventure</p>

            <form id="clubForm" onsubmit="saveClub(event)">

                <!-- ===== COACH ===== -->
                <div class="form-group">
                    <label>🧑‍✈️ Nom du coach</label>
                    <input type="text" id="coachNom" placeholder="Votre pseudo" required>
                </div>

                <!-- ===== CLUB ===== -->
                <div class="form-group">
                    <label>🏷️ Nom du club</label>
                    <input type="text" id="clubNom" placeholder="FC Cotonou" required>
                </div>

                <!-- ===== PAYS & DIVISION ===== -->
                <div class="form-row">
                    <div class="form-group">
                        <label>🏴 Pays</label>
                        <select id="clubPays">
                            <option value="Bénin">🇧🇯 Bénin</option>
                            <option value="Togo">🇹🇬 Togo</option>
                            <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
                            <option value="Sénégal">🇸🇳 Sénégal</option>
                            <option value="Cameroun">🇨🇲 Cameroun</option>
                            <option value="Nigéria">🇳🇬 Nigéria</option>
                            <option value="Ghana">🇬🇭 Ghana</option>
                            <option value="France">🇫🇷 France</option>
                            <option value="Espagne">🇪🇸 Espagne</option>
                            <option value="Angleterre">🇬🇧 Angleterre</option>
                            <option value="Allemagne">🇩🇪 Allemagne</option>
                            <option value="Italie">🇮🇹 Italie</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏆 Division</label>
                        <input type="text" id="clubDivision" placeholder="Ligue 1" value="Ligue 1">
                    </div>
                </div>

                <!-- ===== STADE ===== -->
                <div class="form-group">
                    <label>🏟️ Stade</label>
                    <input type="text" id="clubStade" placeholder="Stade de l'Amitié">
                </div>

                <!-- ===== LOGO ===== -->
                <div class="form-group">
                    <label>🎨 Logo du club</label>
                    <div class="logo-preview" id="logoPreview">
                        <div class="shield" id="logoShield" style="background:linear-gradient(135deg, #FFD700, #f5a623);">
                            <span class="letter" id="logoLetter">F</span>
                        </div>
                        <div class="info">
                            <div class="club-name" id="previewClubName">FC Cotonou</div>
                            <div class="coach-name" id="previewCoachName">Coach</div>
                            <div class="colors" id="previewColors">🎨 #FFD700 / #003366</div>
                        </div>
                    </div>
                    <div class="color-picker-group">
                        <input type="color" id="logoColor1" value="#FFD700" onchange="updatePreview()">
                        <input type="color" id="logoColor2" value="#003366" onchange="updatePreview()">
                        <input type="text" id="logoColors" value="#FFD700 / #003366" placeholder="#FFD700 / #003366" onchange="updatePreview()">
                    </div>
                </div>

                <!-- ===== MAILLOT ===== -->
                <div class="form-group">
                    <label>👕 Couleur du maillot</label>
                    <div class="kit-preview">
                        <div class="shirt" id="shirtPreview" style="background:linear-gradient(135deg, #FFD700, #f5a623);">
                            <div class="collar"></div>
                            <div class="number">10</div>
                        </div>
                        <div>
                            <input type="color" id="kitColor" value="#FFD700" onchange="updateKit()">
                            <span style="color:#5a7a5a;font-size:0.75rem;display:block;margin-top:4px;">Couleur du maillot</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-check"></i> Créer mon club
                </button>
            </form>
        </div>
    </div>

    <script>
        // ===== PREVIEW EN DIRECT =====
        function updatePreview() {
            const c1 = document.getElementById('logoColor1').value;
            const c2 = document.getElementById('logoColor2').value;
            const colors = `${c1} / ${c2}`;
            document.getElementById('logoColors').value = colors;
            document.getElementById('previewColors').textContent = `🎨 ${colors}`;
            document.getElementById('logoShield').style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
        }

        function updateKit() {
            const color = document.getElementById('kitColor').value;
            document.getElementById('shirtPreview').style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
        }

        // ===== METTRE À JOUR LE PRÉVISUALISATION =====
        document.addEventListener('DOMContentLoaded', function() {
            // Récupérer les données de session
            const saved = localStorage.getItem('fm_session_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.pseudo) {
                        document.getElementById('coachNom').value = data.pseudo;
                        document.getElementById('previewCoachName').textContent = data.pseudo;
                    }
                } catch(e) {}
            }

            // Écouter les changements
            document.getElementById('clubNom').addEventListener('input', function() {
                const val = this.value || 'Mon Club';
                document.getElementById('previewClubName').textContent = val;
                document.getElementById('logoLetter').textContent = val.charAt(0).toUpperCase() || 'F';
            });

            document.getElementById('coachNom').addEventListener('input', function() {
                document.getElementById('previewCoachName').textContent = this.value || 'Coach';
            });

            document.getElementById('logoColors').addEventListener('input', function() {
                const parts = this.value.split('/').map(s => s.trim());
                if (parts.length >= 2) {
                    document.getElementById('logoColor1').value = parts[0];
                    document.getElementById('logoColor2').value = parts[1];
                    document.getElementById('previewColors').textContent = `🎨 ${this.value}`;
                    document.getElementById('logoShield').style.background = `linear-gradient(135deg, ${parts[0]}, ${parts[1]})`;
                }
            });
        });

        // ===== SAUVEGARDER =====
        async function saveClub(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Création...';

            const coach = document.getElementById('coachNom').value.trim();
            const nom = document.getElementById('clubNom').value.trim();
            const pays = document.getElementById('clubPays').value;
            const division = document.getElementById('clubDivision').value.trim();
            const stade = document.getElementById('clubStade').value.trim();
            const colors = document.getElementById('logoColors').value.trim();
            const kitColor = document.getElementById('kitColor').value;

            if (!coach) {
                alert('⚠️ Veuillez entrer votre nom de coach');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
                return;
            }

            if (!nom) {
                alert('⚠️ Veuillez entrer un nom de club');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
                return;
            }

            // Récupérer les données existantes
            const saved = localStorage.getItem('fm_session_data');
            if (!saved) {
                alert('❌ Aucune session trouvée');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Créer mon club';
                return;
            }

            const playerData = JSON.parse(saved);
            playerData.pseudo = coach;
            playerData.equipe.nom = nom;
            playerData.equipe.pays = pays;
            playerData.equipe.division = division || 'Ligue 1';
            playerData.equipe.stade = stade || 'Mon Stade';
            playerData.equipe.couleurs = colors || '#FFD700 / #003366';
            playerData.equipe.kitColor = kitColor || '#FFD700';

            // Sauvegarder local
            localStorage.setItem('fm_session_data', JSON.stringify(playerData));

            // Envoyer au serveur
            try {
                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pseudo: playerData.pseudo, data: playerData })
                });
            } catch(e) {}

            btn.innerHTML = '✅ Club créé !';
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);
        }

        // ===== STYLE POUR LE SPINNER =====
        const style = document.createElement('style');
        style.textContent = `
            .spinner {
                display:inline-block;
                width:18px;
                height:18px;
                border:3px solid rgba(10,10,26,0.2);
                border-top-color:#0a0a1a;
                border-radius:50%;
                animation:spin 0.8s linear infinite;
                vertical-align:middle;
                margin-right:8px;
            }
            @keyframes spin { to { transform:rotate(360deg); } }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
