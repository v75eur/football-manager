<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Créer mon équipe - FMTK-v1.26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; min-height:100vh; font-family:'Rajdhani',sans-serif; background:#0a1a0a; color:#fff; overflow-y:auto !important; overflow-x:auto !important; }
        .container { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:15px; background:linear-gradient(180deg,#0a2a0a 0%,#0d1f0d 100%); }
        .card { max-width:750px; width:100%; background:rgba(10,30,10,0.85); backdrop-filter:blur(20px); border-radius:25px; border:1px solid rgba(255,215,0,0.08); padding:30px 25px; box-shadow:0 20px 60px rgba(0,0,0,0.8); }
        .logo { font-family:'Orbitron',monospace; font-size:1.8rem; font-weight:900; color:#FFD700; text-align:center; }
        .logo-sub { font-size:0.6rem; color:#7aaa7a; letter-spacing:6px; text-transform:uppercase; text-align:center; margin-bottom:15px; }
        h1 { font-family:'Orbitron',monospace; font-size:1.2rem; color:#FFD700; text-align:center; margin-bottom:5px; }
        .subtitle { color:#8aaa8a; font-size:0.8rem; text-align:center; margin-bottom:15px; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; color:#8aaa8a; font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
        .form-group input, .form-group select {
            width:100%; padding:10px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
            border-radius:10px; color:#fff; font-size:0.9rem; transition:all 0.3s; font-family:'Rajdhani',sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            border-color:#FFD700; outline:none; box-shadow:0 0 20px rgba(255,215,0,0.05);
        }
        .form-group select option { background:#1a2e1a; color:#fff; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .btn-submit {
            width:100%; padding:14px; background:linear-gradient(135deg,#FFD700,#f5a623); border:none;
            border-radius:12px; color:#0a0a1a; font-family:'Orbitron',monospace; font-size:0.8rem; font-weight:700;
            cursor:pointer; transition:all 0.3s; margin-top:10px;
        }
        .btn-submit:hover { transform:scale(1.02); box-shadow:0 8px 40px rgba(255,215,0,0.2); }
        .btn-submit:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .preview-card { 
            margin-top:20px; background:rgba(255,215,0,0.03); border:1px solid rgba(255,215,0,0.05);
            border-radius:12px; padding:15px; display:none;
        }
        .preview-card.active { display:block; }
        .preview-card h3 { color:#FFD700; font-family:'Orbitron',monospace; font-size:0.8rem; margin-bottom:10px; }
        .preview-item { display:flex; justify-content:space-between; padding:4px 0; color:#aaa; font-size:0.85rem; border-bottom:1px solid rgba(255,255,255,0.03); }
        .preview-item span:last-child { color:#fff; font-weight:600; }
        .preview-budget { color:#2ecc71; font-weight:700; font-size:1.1rem; }
        .preview-budget.small { color:#f39c12; }
        .preview-stars { color:#FFD700; letter-spacing:2px; }
        .loading-spinner { display:none; text-align:center; padding:20px; }
        .loading-spinner.active { display:block; }
        .spinner { width:30px; height:30px; border:3px solid rgba(255,215,0,0.1); border-top-color:#FFD700; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.6rem; font-weight:700; }
        .badge-d1 { background:#2ecc71; color:#fff; }
        .badge-d2 { background:#3498db; color:#fff; }
        .badge-d3 { background:#f39c12; color:#fff; }
        .club-list { max-height:200px; overflow-y:auto; }
        .club-list::-webkit-scrollbar { width:4px; }
        .club-list::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); }
        .club-list::-webkit-scrollbar-thumb { background:#FFD700; border-radius:4px; }
        @media (max-width:600px) { .form-row { grid-template-columns:1fr; } .card { padding:20px 15px; } }
        
        .popup-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); z-index:99999; align-items:center; justify-content:center;
            padding:20px; backdrop-filter:blur(10px);
        }
        .popup-overlay.active { display:flex; }
        .popup-box {
            background:#1a2e1a; border:2px solid rgba(255,215,0,0.2); border-radius:20px;
            padding:35px 30px; max-width:450px; width:100%; box-shadow:0 40px 80px rgba(0,0,0,0.8);
            animation:popupIn 0.4s ease;
        }
        @keyframes popupIn { from { transform:scale(0.8); opacity:0; } to { transform:scale(1); opacity:1; } }
        .popup-box .icon { font-size:3rem; margin-bottom:10px; text-align:center; }
        .popup-box h2 { font-family:'Orbitron',monospace; font-size:1.1rem; color:#FFD700; text-align:center; margin-bottom:8px; }
        .popup-box p { color:#aaa; font-size:0.9rem; line-height:1.6; text-align:center; }
        .popup-box .btn-popup { padding:12px 25px; border:none; border-radius:10px; font-family:'Orbitron',monospace; font-size:0.7rem; font-weight:700; cursor:pointer; transition:all 0.3s; width:100%; margin-top:10px; }
        .popup-box .btn-popup.info { background:linear-gradient(135deg,#FFD700,#f5a623); color:#0a0a1a; }
        .popup-box .btn-popup.success { background:linear-gradient(135deg,#2ecc71,#27ae60); color:#fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">⚽ FMTK</div>
        <div class="logo-sub">v1.26 • Football Manager</div>
        <h1>🏆 CRÉER MON ÉQUIPE</h1>
        <p class="subtitle">Choisissez votre club, budget et stade</p>

        <form id="teamForm">
            <div class="form-group">
                <label><i class="fas fa-flag"></i> Pays du club</label>
                <select id="countrySelect" required>
                    <option value="">🌍 Chargement des pays...</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-futbol"></i> Club</label>
                <select id="clubSelect" required disabled>
                    <option value="">📌 Sélectionnez d'abord un pays</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nom de l'équipe</label>
                    <input type="text" id="teamName" placeholder="Ex: FC Barcelone" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-palette"></i> Couleurs</label>
                    <input type="text" id="teamColors" placeholder="#FFD700 / #003366" value="#FFD700 / #003366">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-building"></i> Stade</label>
                    <input type="text" id="stadium" placeholder="Nom du stade">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-users"></i> Division</label>
                    <select id="divisionSelect">
                        <option value="D1">🏆 Division 1</option>
                        <option value="D2">🏅 Division 2</option>
                        <option value="D3">🎯 Division 3</option>
                    </select>
                </div>
            </div>

            <div class="preview-card" id="previewCard">
                <h3>📋 APERÇU DE L'ÉQUIPE</h3>
                <div id="previewContent"></div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-save"></i> CRÉER MON ÉQUIPE
            </button>
        </form>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p style="color:#8aaa8a;margin-top:10px;font-size:0.8rem;">Chargement des clubs...</p>
        </div>
    </div>
</div>

<!-- ===== POPUP ===== -->
<div class="popup-overlay" id="popup">
    <div class="popup-box">
        <div class="icon" id="popupIcon">✅</div>
        <h2 id="popupTitle">Succès !</h2>
        <p id="popupMessage">Votre équipe a été créée.</p>
        <button class="btn-popup info" onclick="closePopup()">OK</button>
    </div>
</div>

<script>
// ===== BASE DE DONNÉES DES CLUBS AVEC BUDGETS ET STADES =====

    // MOYENS CLUBS (3 étoiles)
    "Lyon": { budget: 320000000, stars: 3, stadium: "Groupama Stadium", capacity: 59186 },
    "Monaco": { budget: 300000000, stars: 3, stadium: "Stade Louis II", capacity: 18523 },

    // PETITS CLUBS (2 étoiles)
    "AS Cotonou": { budget: 80000000, stars: 2, stadium: "Stade Charles de Gaulle", capacity: 15000 },

    "Soleil FC": { budget: 25000000, stars: 2, stadium: "Stade Soleil", capacity: 4000 },

    "Aspac FC": { budget: 18000000, stars: 2, stadium: "Stade Aspac", capacity: 2000 },
    
    // DIVISION 2 (1 étoile)
    "Adjinakou": { budget: 12000000, stars: 1, stadium: "Stade Adjinakou", capacity: 1500 },
    "Agonlin": { budget: 10000000, stars: 1, stadium: "Stade Agonlin", capacity: 1200 },
    "Cotonou FC": { budget: 8000000, stars: 1, stadium: "Stade Cotonou", capacity: 1000 },
    "Ouidah": { budget: 6000000, stars: 1, stadium: "Stade Ouidah", capacity: 800 },
    "Dassa": { budget: 5000000, stars: 1, stadium: "Stade Dassa", capacity: 500 },
    "Kandi": { budget: 4000000, stars: 1, stadium: "Stade Kandi", capacity: 400 },
    "Natitingou": { budget: 3000000, stars: 1, stadium: "Stade Natitingou", capacity: 300 },
    "Djougou": { budget: 2000000, stars: 1, stadium: "Stade Djougou", capacity: 200 }
};

// ===== FONCTION POUR OBTENIR LES INFOS D'UN CLUB =====
function getClubInfo(clubName) {
    if (CLUB_DATABASE[clubName]) {
        return CLUB_DATABASE[clubName];
    }
    // Générer des infos réalistes pour un club inconnu
    const randomBudget = Math.floor(Math.random() * 90000000) + 10000000;
    const stars = Math.floor(Math.random() * 3) + 1;
    const capacities = [1000, 2000, 3000, 5000, 8000, 10000, 15000, 20000];
    const capacity = capacities[Math.floor(Math.random() * capacities.length)];
    const stadiums = [
        `Stade ${clubName.split(' ').pop()}`,
        `${clubName} Arena`,
        `Parc des ${clubName.split(' ').pop()}s`,
        `Stade Municipal de ${clubName.split(' ').pop()}`
    ];
    return {
        budget: randomBudget,
        stars: stars,
        stadium: stadiums[Math.floor(Math.random() * stadiums.length)],
        capacity: capacity
    };
}

// ===== CHARGER LES CLUBS DEPUIS LE FICHIER JSON =====
let allClubsData = {};

async function loadClubsData() {
    const spinner = document.getElementById('loadingSpinner');
    spinner.classList.add('active');
    
    try {
        const response = await fetch('/data/clubs_complete.json');
        if (!response.ok) throw new Error('Fichier non trouvé');
        allClubsData = await response.json();
        populateCountries();
    } catch(e) {
        console.error('Erreur:', e);
        showPopup('❌', 'Erreur', 'Impossible de charger les clubs');
    } finally {
        spinner.classList.remove('active');
    }
}

function populateCountries() {
    const countrySelect = document.getElementById('countrySelect');
    countrySelect.innerHTML = '<option value="">🌍 Sélectionnez un pays</option>';
    
    // Grouper par continent
    const continents = {
        '🇪🇺 Europe': [],
        '🌍 Afrique': [],
        '🌏 Asie': [],
        '🌎 Amérique': [],
        '🌊 Océanie': []
    };
    
    for (const [continent, countries] of Object.entries(allClubsData)) {
        const emoji = continent === 'UEFA' ? '🇪🇺' :
                     continent === 'CAF' ? '🌍' :
                     continent === 'AFC' ? '🌏' :
                     continent === 'CONMEBOL' || continent === 'CONCACAF' ? '🌎' : '🌊';
        const label = continent === 'UEFA' ? 'Europe' :
                     continent === 'CAF' ? 'Afrique' :
                     continent === 'AFC' ? 'Asie' :
                     continent === 'CONMEBOL' ? 'Amérique du Sud' :
                     continent === 'CONCACAF' ? 'Amérique du Nord' : 'Océanie';
        
        const optgroup = document.createElement('optgroup');
        optgroup.label = `${emoji} ${label}`;
        
        for (const country of Object.keys(countries).sort()) {
            const option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            optgroup.appendChild(option);
        }
        countrySelect.appendChild(optgroup);
    }
    
    countrySelect.addEventListener('change', updateClubs);
    countrySelect.value = 'Bénin';
    updateClubs();
}

function updateClubs() {
    const country = document.getElementById('countrySelect').value;
    const clubSelect = document.getElementById('clubSelect');
    const previewCard = document.getElementById('previewCard');
    const previewContent = document.getElementById('previewContent');
    
    clubSelect.innerHTML = '<option value="">📌 Sélectionnez un club</option>';
    clubSelect.disabled = true;
    previewCard.classList.remove('active');
    
    if (!country || !allClubsData) return;
    
    let found = false;
    const clubs = [];
    
    for (const [continent, countries] of Object.entries(allClubsData)) {
        if (countries[country]) {
            for (const [division, clubList] of Object.entries(countries[country])) {
                for (const club of clubList) {
                    clubs.push({ name: club, division: division });
                    found = true;
                }
            }
        }
    }
    
    if (!found) {
        clubSelect.innerHTML = '<option value="">⚠️ Aucun club trouvé</option>';
        clubSelect.disabled = true;
        return;
    }
    
    clubSelect.disabled = false;
    clubs.sort((a, b) => a.name.localeCompare(b.name));
    
    const divNames = {'D1': '🏆 Division 1', 'D2': '🏅 Division 2', 'D3': '🎯 Division 3'};
    
    for (const club of clubs) {
        const option = document.createElement('option');
        option.value = club.name;
        const info = getClubInfo(club.name);
        const stars = '⭐'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
        option.textContent = `${club.name} - ${stars} ${(info.budget / 1000000).toFixed(0)}M€`;
        option.dataset.division = club.division;
        clubSelect.appendChild(option);
    }
    
    clubSelect.addEventListener('change', updatePreview);
    document.getElementById('teamName').addEventListener('input', updatePreview);
    document.getElementById('divisionSelect').addEventListener('change', updatePreview);
    
    if (clubSelect.options.length > 1) {
        clubSelect.selectedIndex = 1;
        updatePreview();
    }
}

function updatePreview() {
    const club = document.getElementById('clubSelect').value;
    const teamName = document.getElementById('teamName').value || 'Nom de l\'équipe';
    const division = document.getElementById('divisionSelect').value;
    const colors = document.getElementById('teamColors').value || '#FFD700 / #003366';
    const country = document.getElementById('countrySelect').value;
    
    const previewCard = document.getElementById('previewCard');
    const previewContent = document.getElementById('previewContent');
    
    if (!club || club === '📌 Sélectionnez un club') {
        previewCard.classList.remove('active');
        return;
    }
    
    previewCard.classList.add('active');
    
    const info = getClubInfo(club);
    const stars = '⭐'.repeat(info.stars) + '☆'.repeat(5 - info.stars);
    const divNames = {'D1': '🏆 Division 1', 'D2': '🏅 Division 2', 'D3': '🎯 Division 3'};
    const budgetDisplay = (info.budget / 1000000).toFixed(0);
    const budgetClass = info.budget > 500000000 ? '' : 'small';
    
    // Déterminer le stade
    let stadium = document.getElementById('stadium').value;
    if (!stadium || stadium === '') {
        stadium = info.stadium || `${club} Stadium`;
    }
    
    previewContent.innerHTML = `
        <div class="preview-item"><span>🏷️ Nom</span><span>${teamName}</span></div>
        <div class="preview-item"><span>🌍 Pays</span><span>${country}</span></div>
        <div class="preview-item"><span>⚽ Club</span><span>${club}</span></div>
        <div class="preview-item"><span>⭐ Niveau</span><span class="preview-stars">${stars}</span></div>
        <div class="preview-item"><span>💰 Budget</span><span class="preview-budget ${budgetClass}">${budgetDisplay} M€</span></div>
        <div class="preview-item"><span>🏅 Division</span><span>${divNames[division] || division}</span></div>
        <div class="preview-item"><span>🏟️ Stade</span><span>${stadium} (${info.capacity || '?'} places)</span></div>
        <div class="preview-item"><span>🎨 Couleurs</span><span>${colors}</span></div>
        <div class="preview-item" style="border-bottom:none;padding-top:8px;margin-top:4px;border-top:1px solid rgba(255,215,0,0.1);">
            <span style="color:#FFD700;">⚡ Effectif</span>
            <span style="color:#2ecc71;">25 joueurs</span>
        </div>
    `;
    
    // Mettre à jour le stade si vide
    if (!document.getElementById('stadium').value) {
        document.getElementById('stadium').value = stadium;
    }
}

// ===== SOUMISSION =====
document.getElementById('teamForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CRÉATION...';
    
    const club = document.getElementById('clubSelect').value;
    const info = getClubInfo(club);
    const data = {
        nom: document.getElementById('teamName').value,
        pays: document.getElementById('countrySelect').value,
        club: club,
        division: document.getElementById('divisionSelect').value,
        stade: document.getElementById('stadium').value || info.stadium,
        couleurs: document.getElementById('teamColors').value,
        budget: info.budget,
        stars: info.stars,
        capacity: info.capacity
    };
    
    try {
        // Sauvegarder dans sessionStorage
        sessionStorage.setItem('fmtk_team_data', JSON.stringify(data));
        showPopup('✅', 'Équipe créée !', `Votre équipe ${data.nom} est prête avec un budget de ${(data.budget/1000000).toFixed(0)} M€ !`);
        setTimeout(() => {
            window.location.href = '/dashboard';
        }, 2000);
    } catch(e) {
        showPopup('❌', 'Erreur', 'Impossible de créer l\'équipe: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> CRÉER MON ÉQUIPE';
    }
});

// ===== POPUP =====
function showPopup(icon, title, message) {
    document.getElementById('popupIcon').textContent = icon;
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    document.getElementById('popup').classList.add('active');
}

function closePopup() {
    document.getElementById('popup').classList.remove('active');
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
    // Récupérer les données de session
    try {
        const sessionData = sessionStorage.getItem('fmtk_session_data');
        if (sessionData) {
            const data = JSON.parse(sessionData);
            if (data && data.pseudo) {
                document.getElementById('teamName').value = data.pseudo + ' FC';
            }
        }
    } catch(e) {}
    
    loadClubsData();
});
</script>
