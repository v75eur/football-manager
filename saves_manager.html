<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Sauvegardes - FMTK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial,sans-serif; background:#0a1a0a; color:#fff; padding:20px; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .logo { font-size:1.5rem; color:#FFD700; font-weight:bold; }
        .card { background:rgba(10,30,10,0.85); border-radius:10px; padding:20px; margin-bottom:15px; border:1px solid rgba(255,215,0,0.05); }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:10px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.05); }
        th { color:#FFD700; }
        .btn { padding:4px 10px; border:none; border-radius:4px; cursor:pointer; font-size:0.7rem; }
        .btn-danger { background:#e74c3c; color:#fff; }
        .btn-warning { background:#f39c12; color:#fff; }
        .btn-success { background:#2ecc71; color:#fff; }
        .btn-info { background:#3498db; color:#fff; }
        .status { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.6rem; }
        .status-active { background:#2ecc71; color:#fff; }
        .status-locked { background:#e74c3c; color:#fff; }
        .back { color:#7aaa7a; text-decoration:none; }
        .back:hover { color:#FFD700; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📂 Gestion des Sauvegardes</div>
        <a href="/" class="back">← Retour</a>
    </div>
    
    <div class="card">
        <h3>📊 Statistiques</h3>
        <div id="stats">Chargement...</div>
    </div>
    
    <div class="card">
        <h3>📋 Liste des sauvegardes</h3>
        <div id="list">Chargement...</div>
    </div>
    
    <script>
        async function loadSaves() {
            try {
                const response = await fetch('/api/saves/list');
                const data = await response.json();
                if (data.success) {
                    const saves = data.saves || [];
                    document.getElementById('stats').innerHTML = `
                        Total: ${saves.length} | 
                        Actives: ${saves.filter(s => s.status === 'active').length} | 
                        Verrouillées: ${saves.filter(s => s.status === 'locked').length}
                    `;
                    let html = '<table><tr><th>Pseudo</th><th>Club</th><th>Date</th><th>Statut</th><th>Actions</th></tr>';
                    saves.forEach(s => {
                        html += `<tr>
                            <td>${s.pseudo}</td>
                            <td>${s.club || '-'}</td>
                            <td>${new Date(s.date).toLocaleString()}</td>
                            <td><span class="status ${s.status === 'active' ? 'status-active' : 'status-locked'}">${s.status}</span></td>
                            <td>
                                <button class="btn btn-info" onclick="window.location.href='/download/${s.pseudo}'">📥</button>
                                <button class="btn btn-warning" onclick="alert('Fonction à venir')">🔒</button>
                                <button class="btn btn-danger" onclick="if(confirm('Supprimer ?')){deleteSave('${s.pseudo}')}">🗑️</button>
                            </td>
                        </tr>`;
                    });
                    html += '</table>';
                    document.getElementById('list').innerHTML = html;
                }
            } catch(e) {
                document.getElementById('list').innerHTML = 'Erreur de chargement';
            }
        }
        
        async function deleteSave(pseudo) {
            try {
                const response = await fetch(`/api/saves/delete/${pseudo}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('✅ Sauvegarde supprimée');
                    loadSaves();
                }
            } catch(e) {
                alert('❌ Erreur');
            }
        }
        
        loadSaves();
    </script>
</body>
</html>
